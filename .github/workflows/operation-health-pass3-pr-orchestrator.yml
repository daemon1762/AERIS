name: Operation Health Pass 3 PR Orchestrator
on:
  pull_request:
    branches: [cp3.75/nd-recovery]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: read
jobs:
  run:
    if: github.head_ref == 'automation/operation-health-pass3-trigger'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Register runtime-validated stable development checkpoints
        shell: bash
        run: |
          set -u
          register_release() {
            TAG="$1"; SHA="$2"; TITLE="$3"; ASSET="$4"; PREFIX="$5"; NOTES="$6"
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "$TAG already exists; unchanged."
              return 0
            fi
            git archive --format=zip --output="$ASSET" --prefix="$PREFIX/" "$SHA" || return 0
            sha256sum "$ASSET" > "$ASSET.sha256"
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --repo "$REPO" --target "$SHA" --title "$TITLE" --notes "$NOTES" --prerelease || true
          }
          register_release \
            'v0.18.0.0-dev-cp3.75-candidate11-foundation' \
            '6de1bb6a7098dabbdf70aa257eddc5e0f42edfe7' \
            'AERIS v0.18.0.0 DEV CP3.75 Candidate11 — Foundation Baseline' \
            'AERISFlightControl-v0.18.0.0_DEV_CP3.75_Candidate11_FoundationBaseline_Source.zip' \
            'AERIS-Candidate11-Foundation' \
            $'Known-good CP3.75 ND foundation checkpoint before Operation Health optimization.\n\nCommit: `6de1bb6a7098dabbdf70aa257eddc5e0f42edfe7`\n\nDevelopment pre-release source snapshot. The repository does not contain the locally built KSP DLL; build against a legitimate KSP 1.12.5 installation.'
          register_release \
            'v0.18.0.0-dev-cp3.75-operation-health-pass2' \
            '9a9645a210cf979b016afb197230acff81796c4d' \
            'AERIS v0.18.0.0 DEV CP3.75 — Operation Health Pass 2' \
            'AERISFlightControl-v0.18.0.0_DEV_CP3.75_OperationHealthPass2_Source.zip' \
            'AERIS-OperationHealthPass2' \
            $'Runtime-validated Operation Health checkpoint preserving Candidate11 visual authority.\n\nCommit: `9a9645a210cf979b016afb197230acff81796c4d`\n\nValidated persistent/recycled GPU Mesh operation, no detected visual-quality regression, no return of ownship/prediction/range-fan jumping, and no terrain GPU failure in the submitted runtime session. Known quality follow-up: localized high-magnification coastal fill gaps and contour refinement on small steep islands.\n\nDevelopment pre-release source snapshot; build against a legitimate KSP 1.12.5 installation.'
      - name: Apply Operation Health Pass 3
        shell: bash
        run: |
          set -u
          python3 Tools/_operation_health_pass3_projection_draw_patch.py || { echo 'PASS3_PATCH_FAILED'; exit 0; }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GameData/AERISFlightControl/AERISFlightControl.version')
          s=p.read_text().replace('Operation Health Pass 2','Operation Health Pass 3')
          p.write_text(s)
          p=Path('Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs')
          s=p.read_text().replace('OPERATION HEALTH PASS 2','OPERATION HEALTH PASS 3').replace('Operation Health Pass 2','Operation Health Pass 3')
          p.write_text(s)
          p=Path('build_ubuntu.sh')
          s=p.read_text().replace('OPERATION HEALTH PASS 2','OPERATION HEALTH PASS 3').replace('run_v01800_operation_health_pass2_prebuild.py','run_v01800_operation_health_pass3_prebuild.py')
          p.write_text(s)
          PY
          python3 Tools/run_v01800_operation_health_pass3_prebuild.py || { echo 'PASS3_PREBUILD_FAILED'; git reset --hard HEAD; exit 0; }
          python3 - <<'PY'
          try:
              from tree_sitter_languages import get_parser
          except Exception:
              raise SystemExit(0)
          from pathlib import Path
          parser=get_parser('c_sharp')
          for f in ['Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs','Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs']:
              root=parser.parse(Path(f).read_bytes()).root_node
              if root.has_error:
                  print('C# parse error:',f)
                  raise SystemExit(1)
          print('C# tree-sitter parse PASS')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/register-stable-dev-releases.yml \
                .github/workflows/operation-health-pass3-one-shot.yml \
                .github/workflows/operation-health-pass3-pr-orchestrator.yml \
                Evidence/REGISTER_STABLE_DEV_RELEASES_TRIGGER.txt \
                Evidence/OPERATION_HEALTH_PASS3_TRIGGER.txt \
                Tools/_operation_health_pass3_projection_draw_patch.py
          cat > Evidence/OPERATION_HEALTH_PASS3_STATIC_VALIDATION.txt <<'EOF'
          Operation Health Pass 3 static validation
          prebuild=PASS
          visual_authority_changed=NO
          runtime_ksp=UNVERIFIED
          release_candidate=NO_UNTIL_RUNTIME_PASS
          EOF
          git add -A
          git commit -m 'Finalize Operation Health Pass 3 projection draw reduction' || exit 0
          git push origin HEAD:cp3.75/nd-recovery || true
