name: AERIS25 GPU Dynamic Colour Static

on:
  push:
    branches:
      - agent/aeris25-gpu-dynamic-terrain-colour
  pull_request:
    branches:
      - agent/aeris24-gpu-vertex-projection-poc

jobs:
  source-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AERIS25 script syntax
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_gpu_dynamic_terrain_colour.py \
            Tools/verify_aeris25_gpu_dynamic_terrain_colour.py \
            Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            Tools/verify_aeris25_gpu_dynamic_terrain_colour_ready.py \
            Tools/prepare_aeris25_gpu_dynamic_terrain_colour_runtime.py
          bash -n Tools/build_aeris25_gpu_shader_bundle.sh
      - name: Generate and verify AERIS25 ATROPINE candidate
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo '=== FIRST GENERATION ===' | tee aeris25_gpu_dynamic_colour_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            2>&1 | tee -a aeris25_gpu_dynamic_colour_static.log
          echo '=== IDEMPOTENT RE-ENTRY ===' | tee -a aeris25_gpu_dynamic_colour_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            2>&1 | tee -a aeris25_gpu_dynamic_colour_static.log
          grep -Fq 'core ATROPINE tree already present; reconstruction skipped' aeris25_gpu_dynamic_colour_static.log
          grep -Fq '[AERIS25 GPU DYNAMIC COLOUR READY] STATIC READY PASS' aeris25_gpu_dynamic_colour_static.log
      - name: Upload AERIS25 static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-gpu-dynamic-colour-static-log
          path: aeris25_gpu_dynamic_colour_static.log
          if-no-files-found: error
      - name: Fail if AERIS25 static gate failed
        if: steps.candidate.outcome == 'failure'
        shell: bash
        run: |
          tail -n 120 aeris25_gpu_dynamic_colour_static.log || true
          SUMMARY="$(tail -n 45 aeris25_gpu_dynamic_colour_static.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=AERIS25 ATROPINE static candidate gate::${SUMMARY}"
          exit 1
