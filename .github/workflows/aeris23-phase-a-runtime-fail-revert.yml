name: AERIS23 Phase A Runtime FAIL Revert

on:
  pull_request:
    branches:
      - cp3.75/nd-recovery

permissions:
  contents: write

jobs:
  revert-and-verify:
    if: ${{ github.head_ref == 'agent/aeris23-phase-a-runtime-fail-revert' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aeris23-phase-a-runtime-fail-revert
          fetch-depth: 0
      - name: Revert Phase A measurement candidate
        shell: bash
        run: |
          git revert --no-commit 932d1268d158ec497f5ae073240fcbf9d3ce53c8
          git rm .github/workflows/aeris23-phase-a-runtime-fail-revert.yml
      - name: Static regression tests
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          git diff --check
      - name: Commit runtime-fail rollback
        shell: bash
        run: |
          git config user.name 'AERIS Patch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Revert Phase A measurement after runtime visual regression'
          git push origin HEAD:agent/aeris23-phase-a-runtime-fail-revert
