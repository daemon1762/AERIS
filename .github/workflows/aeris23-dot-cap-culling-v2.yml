name: AERIS23 Dot Cap Culling V2
on:
  pull_request:
    branches:
      - cp3.75/nd-recovery
    types: [synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.head_ref == 'agent/aeris23-dot-cap-culling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aeris23-dot-cap-culling
          fetch-depth: 0
      - name: Apply original patch with corrected hot-path test boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          y=Path('.github/workflows/aeris23-dot-cap-culling.yml').read_text()
          marker="python3 - <<'PY'\n"
          a=y.index(marker)+len(marker)
          b=y.index('\n          PY',a)
          block=y[a:b]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          ns={'__name__':'__main__'}
          exec('\n'.join(lines),ns,ns)
          test=Path('Tools/selftest_v01800_operation_health_dot_cap_culling.py')
          t=test.read_text()
          old="end=R.index('static void ResolveConservativeEntryBounds',start)"
          new="end=R.index('static bool ResolveViewportCullCap',start)"
          if t.count(old)!=1:
              raise SystemExit('dot-cap selftest boundary anchor='+str(t.count(old)))
          test.write_text(t.replace(old,new,1))
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          s=r.index('bool ShouldCullEntryOutsidePresentation')
          e=r.index('static bool ResolveViewportCullCap',s)
          hot=r[s:e]
          forbidden=('GreatCircleDistanceMeters','Math.Atan2','Math.Sqrt','Math.Sin','Math.Cos')
          assert all(x not in hot for x in forbidden), [x for x in forbidden if x in hot]
          assert 'dot < thresholdCos' in hot
          assert 'rangeMeters < 120000f' not in r
          assert 'oh_dot_cap_test=' in r
          print('per-entry dot-cap hot-path audit PASS')
          PY
          git config user.name 'AERIS Patch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs \
            Tools/run_v01800_operation_health_pass3_prebuild.py \
            Tools/selftest_v01800_operation_health_conservative_entry_culling.py \
            Tools/selftest_v01800_operation_health_dot_cap_culling.py
          git commit -m 'Use cheap dot-cap culling at all ND ranges'
          git rm .github/workflows/aeris23-dot-cap-culling.yml \
            .github/workflows/aeris23-dot-cap-culling-v2.yml
          git commit -m 'Remove temporary dot-cap validators'
          git push origin HEAD:agent/aeris23-dot-cap-culling
