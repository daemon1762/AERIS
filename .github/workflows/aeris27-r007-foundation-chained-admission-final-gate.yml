name: AERIS27 R007 Foundation Chained Admission Final Gate

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r007-foundation-chained-admission
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  r007-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/apply_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py
          rm -rf Tools/__pycache__

      - name: Reconstruct accepted lineage through R005
        shell: bash
        run: |
          set -euo pipefail
          for s in \
            apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            apply_aeris25_chunk_cull_guard_hotfix.py \
            apply_aeris25_temporal_foundation_overscan_hotfix.py \
            apply_aeris25_foundation_cull_bypass_hotfix.py \
            apply_aeris25_renderable_entry_gate_hotfix.py \
            apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py \
            apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py \
            apply_aeris25_content_generation_burst_governor_hotfix.py \
            apply_aeris25_persistent_presentation_batching.py \
            apply_aeris25_main_thread_commit_governor.py \
            apply_aeris25_staged_main_thread_commit_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            apply_aeris25_authoritative_publication_lifetime_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            fix_aeris25_phase6_003_inherited_selftests.py \
            apply_aeris26_rev003_observer.py \
            apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py \
            apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py \
            apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py \
            apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py \
            apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py; do
              PYTHONDONTWRITEBYTECODE=1 python3 "Tools/$s" >/dev/null
          done

      - name: Apply R006 HF1 HF2 HF3 HF4 parent
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py

      - name: Apply R007
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py

      - name: Verify inherited safety and R007 final tree
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_resumable_prepare.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py
          git diff --check

      - name: Exact R007 no-widening contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          marker = 'AERIS27_REV3_5_SALBUTAMOL_SULFATE_R007_FOUNDATION_CHAINED_ADMISSION'
          assert marker in r
          assert 'Rev35R007FoundationQueueMaximum = 128' in r
          assert 'Queue<string> rev35R007FoundationQueue' in r
          assert 'QueueRev35R007FoundationField(tile, cacheKey);' in r
          ps = r.index('void PumpStagedCompletedCommit(AERISTerrainTileSystem system,')
          pe = r.index('bool TryBeginPendingEntryCommit(', ps)
          pump = r[ps:pe]
          assert pump.index('TryBeginRev35R007QueuedFoundationCommit();') < pump.index('rasterizer.Drain(completed, 1)')
          assert 'ResolveRev35R004CommitBudget(steadyCommitProfile)' in pump
          assert 'publishedThisWindow < hardMaximum' in pump
          assert 'Rev35R004BudgetMaximumMilliseconds = 2.00' in r
          assert 'Rev35R005SourceChunkHardCap = 64' in r
          assert 'presentationNow + 0.10f' in r
          assert 'foundationComplete = rendered && visible.FoundationComplete &&' in r
          assert 'lastBackFoundationCoverage >= 0.999f' in r
          assert 'readyFar >= visible.FarFoundationCount' in r
          assert 'RenderTextureFormat.ARGB32' in r and 'FilterMode.Bilinear' in r
          assert 'Task.Run(' not in r and 'new Thread(' not in r and 'ThreadPool.' not in r
          print('[AERIS27 R007] NO-WIDENING FOUNDATION CHAIN CONTRACT PASS')
          PY

      - name: Rejected mechanism guard
        shell: bash
        run: |
          set -euo pipefail
          R=Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
          ! grep -Fq 'Task.Run(' "$R"
          ! grep -Fq 'new Thread(' "$R"
          ! grep -Fq 'ThreadPool.' "$R"
          ! grep -Fq 'WaitManagedPreparation' "$R"
          ! grep -Fq 'ResidentPreparedPresentation' "$R"
          ! grep -Fq 'AERIS25_PHASE6_004_MANAGED_PREPARATION_PIPELINE' "$R"
          ! grep -Fq 'AERIS25_PHASE6_005_NONBLOCKING_SPECULATIVE_PREPARATION' "$R"
          ! grep -Fq 'AERIS25_PHASE7_001_DIAZEPAM_RESIDENT_RAM_REUSE' "$R"

      - name: Publish authoritative R007 gate status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export AERIS_GATE_STATE=failure
          if [ "$PRIOR_JOB_STATUS" = "success" ]; then
            export AERIS_GATE_STATE=success
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          state = os.environ['AERIS_GATE_STATE']
          data = json.dumps({
              'state': state,
              'context': 'AERIS27/R007-FINAL-GATE',
              'description': 'R007 foundation chained admission ' + state.upper(),
          }).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/%s/statuses/%s' % (repo, sha),
              data=data, method='POST', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AERIS27-R007-Gate',
                  'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              body = json.loads(response.read().decode())
          print('[AERIS27 R007] status receipt:', body.get('state'), body.get('context'))
          PY
