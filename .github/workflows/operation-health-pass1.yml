name: Operation Health Pass 1
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply zero-visual-cost renderer patch
        run: python3 Tools/_operation_health_pass1_patch.py
      - name: Remove one-shot files
        run: rm -f Tools/_operation_health_pass1_patch.py .github/workflows/operation-health-pass1.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Operation Health pass 1 zero-visual-cost renderer reduction"
          git push origin HEAD:cp3.75/nd-recovery
