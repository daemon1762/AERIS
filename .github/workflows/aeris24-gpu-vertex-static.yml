name: AERIS24 GPU Vertex Static

on:
  push:
    branches:
      - agent/aeris24-gpu-vertex-projection-poc
  pull_request:
    branches:
      - agent/aeris23-oh-penicillin

jobs:
  source-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax
        run: |
          python3 -m py_compile \
            Tools/fix_aeris24_gpu_vertex_projection_poc_anchors.py \
            Tools/apply_aeris24_gpu_vertex_projection_poc.py \
            Tools/fix_aeris24_gpu_vertex_single_authority_selftest.py \
            Tools/verify_aeris24_gpu_vertex_projection_poc.py \
            Tools/apply_aeris24_gpu_vertex_projection_ready.py
      - name: Prepare and verify complete static candidate
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris24_gpu_vertex_projection_ready.py \
            2>&1 | tee aeris24_gpu_vertex_static.log
      - name: Upload static candidate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris24-gpu-vertex-static-log
          path: aeris24_gpu_vertex_static.log
          if-no-files-found: error
      - name: Fail if static candidate gate failed
        if: steps.candidate.outcome == 'failure'
        run: exit 1
