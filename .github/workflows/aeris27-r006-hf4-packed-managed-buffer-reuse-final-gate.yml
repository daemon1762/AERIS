name: AERIS27 R006 Hotfix4 Packed Managed Buffer Reuse Final Gate

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r006-hf4-packed-managed-buffer-reuse
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  r006-hf4-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/verify_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py \
            Tools/apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py \
            Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py \
            Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py \
            Tools/apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py \
            Tools/apply_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py \
            Tools/verify_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py \
            Tools/prepare_aeris27_rev3_5_salbutamol_r006_hf3_runtime.py \
            Tools/prepare_aeris27_rev3_5_salbutamol_r006_hf4_runtime.py
          rm -rf Tools/__pycache__

      - name: Reconstruct accepted lineage through R005
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_003_inherited_selftests.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris26_rev003_observer.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py >/dev/null

      - name: Apply R006 plus HF1 HF2 HF3 HF4
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py

      - name: Verify inherited safety and HF4 final tree
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_resumable_prepare.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py
          git diff --check

      - name: Exact packed-buffer lifetime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          t = Path('Source/AERISFlightControl/Terrain/AERISTerrainTileSystem.cs').read_text()
          marker = 'AERIS27_REV3_5_SALBUTAMOL_SULFATE_R006_PACKED_MANAGED_BUFFER_REUSE_HOTFIX4'
          hf3 = 'AERIS27_REV3_5_SALBUTAMOL_SULFATE_R006_COMPLETE_COVERAGE_CONTRACT_HOTFIX3'
          assert marker in r and hf3 in t
          assert 'Rev35R006Hf4ColourPoolMaximumBytes = 16L * 1024L * 1024L' in r
          assert 'Rev35R006Hf4ColourPoolMaximumArrays = 128' in r
          assert 'Rev35R006Hf4IndexPoolMaximumBytes = 8L * 1024L * 1024L' in r
          assert 'Rev35R006Hf4IndexPoolMaximumArrays = 128' in r
          ps = r.index('bool AdvancePendingPackedTerrain(PendingEntryCommit pending,')
          pe = r.index('Mesh UploadPreparedPackedTerrainMesh', ps)
          packed = r[ps:pe]
          assert 'pending.PackedSource = new Vector3[count];' in packed
          assert 'AcquireRev35R006Hf4ColourBuffer(count)' in packed
          assert 'AcquireRev35R006Hf4IndexBuffer(count)' in packed
          assert 'pending.PackedColours = new Color32[count];' not in packed
          assert 'pending.PackedIndices = new int[count];' not in packed
          fs = r.index('bool FinalizePendingEntryCommit(PendingEntryCommit pending,')
          fe = r.index('void CancelPendingEntryCommit()', fs)
          final = r[fs:fe]
          a = final.index('PackedTerrainColours = pending.PackedColours,')
          b = final.index('operationHealthRev35R006Hf4ColourOwnershipTransfer++')
          c = final.index('pending.PackedColours = null;', b)
          d = final.index('RecycleRev35R006Hf4IndexBuffer(ref pending.PackedIndices);')
          assert a < b < c < d
          assert 'PackedTerrainProjectedVertices = pending.PackedSource,' in final
          assert 'RecycleRev35R006Hf4ColourBuffer(ref pending.PackedSource)' not in r
          assert 'RecycleRev35R006Hf4IndexBuffer(ref pending.PackedSource)' not in r
          rs = r.index('void ReleaseDeferredEntryRetirements(bool force)')
          re = r.index('void ', rs + 10)
          retirement = r[rs:re]
          pin = retirement.index('presentationEntryPins.Contains(entry)')
          colour = retirement.index('RecycleRev35R006Hf4EntryPackedBuffers(entry)')
          geo = retirement.index('RecycleRev35R006EntryGeographic(entry)')
          mesh = retirement.index('RecycleMesh(ref entry.PackedTerrainMesh)')
          assert pin < colour < geo < mesh
          gs = r.index('void ReleaseGpuResources()')
          ge = r.index('public void Dispose()', gs)
          release = r[gs:ge]
          reset = release.index('ResetContentSnapshot();')
          clear = release.index('ClearRev35R006Hf4PackedPools();', reset)
          destroy = release.index('DestroyRenderTargets();', reset)
          assert reset < clear < destroy
          assert 'presentationNow + 0.10f' in r
          assert 'RenderTextureFormat.ARGB32' in r and 'FilterMode.Bilinear' in r
          print('[AERIS27 R006 HF4] PACKED BUFFER LIFETIME CONTRACT PASS')
          PY

      - name: Rejected mechanism guard
        shell: bash
        run: |
          set -euo pipefail
          R=Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
          ! grep -Fq 'Task.Run(' "$R"
          ! grep -Fq 'new Thread(' "$R"
          ! grep -Fq 'ThreadPool.' "$R"
          ! grep -Fq 'AERIS25_PHASE6_004_MANAGED_PREPARATION_PIPELINE' "$R"
          ! grep -Fq 'AERIS25_PHASE6_005_NONBLOCKING_SPECULATIVE_PREPARATION' "$R"
          ! grep -Fq 'AERIS25_PHASE7_001_DIAZEPAM_RESIDENT_RAM_REUSE' "$R"
          ! grep -Fq 'WaitManagedPreparation' "$R"
          ! grep -Fq 'ResidentPreparedPresentation' "$R"

      - name: No tool residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Tools/__pycache__
          test -z "$(git status --porcelain | grep '__pycache__' || true)"

      - name: Publish authoritative HF4 gate status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export AERIS_GATE_STATE=failure
          if [ "$PRIOR_JOB_STATUS" = "success" ]; then
            export AERIS_GATE_STATE=success
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          state = os.environ['AERIS_GATE_STATE']
          data = json.dumps({
              'state': state,
              'context': 'AERIS27/R006-HF4-FINAL-GATE',
              'description': 'R006 packed managed buffer HF4 ' + state.upper(),
          }).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/%s/statuses/%s' % (repo, sha),
              data=data, method='POST', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AERIS27-R006-HF4-Gate',
                  'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              body = json.loads(response.read().decode())
          print('[AERIS27 R006 HF4] status receipt:', body.get('state'), body.get('context'))
          PY
