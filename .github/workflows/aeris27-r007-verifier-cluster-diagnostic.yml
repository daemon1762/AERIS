name: AERIS27 R007 Verifier Cluster Diagnostic

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r007-foundation-chained-admission
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reconstruct and apply
        run: |
          set -euo pipefail
          for s in \
            apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            apply_aeris25_chunk_cull_guard_hotfix.py \
            apply_aeris25_temporal_foundation_overscan_hotfix.py \
            apply_aeris25_foundation_cull_bypass_hotfix.py \
            apply_aeris25_renderable_entry_gate_hotfix.py \
            apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py \
            apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py \
            apply_aeris25_content_generation_burst_governor_hotfix.py \
            apply_aeris25_persistent_presentation_batching.py \
            apply_aeris25_main_thread_commit_governor.py \
            apply_aeris25_staged_main_thread_commit_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            apply_aeris25_authoritative_publication_lifetime_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            fix_aeris25_phase6_003_inherited_selftests.py \
            apply_aeris26_rev003_observer.py \
            apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py \
            apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py \
            apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py \
            apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py \
            apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py \
            apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py \
            apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py \
            apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py \
            apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py \
            apply_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py \
            apply_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py; do
              PYTHONDONTWRITEBYTECODE=1 python3 "Tools/$s" >/dev/null
          done
      - name: Queue cluster
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          assert 'Rev35R007FoundationQueueMaximum = 128' in r
          assert 'Queue<string> rev35R007FoundationQueue' in r
          assert 'HashSet<string> rev35R007FoundationQueued' in r
          assert 'tile.Key.Lod != AERISTerrainTileLod.Far' in r
          assert 'QueueRev35R007FoundationField(tile, cacheKey);' in r
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-V-QUEUE'
      - name: Pump cluster
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          s=r.index('void PumpStagedCompletedCommit(AERISTerrainTileSystem system,')
          e=r.index('bool TryBeginPendingEntryCommit(',s)
          p=r[s:e]
          assert p.index('TryBeginRev35R007QueuedFoundationCommit();') < p.index('rasterizer.Drain(completed, 1)')
          assert 'ResolveRev35R004CommitBudget(steadyCommitProfile)' in p
          assert 'publishedThisWindow < hardMaximum' in p
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-V-PUMP'
      - name: Draw cluster
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          s=r.index('internal AERISTerrainGpuDrawState Draw(Rect plot,')
          e=r.index('void ResetFrontBufferState',s)
          d=r[s:e]
          a=d.index('if (contentGeometryChanged)')
          b=d.index('ResetRev35R007FoundationQueue();',a)
          c=d.index('PumpStagedCompletedCommit(system,',b)
          q=d.index('requested.Clear();',c)
          z=d.index('ResetRev35R007FoundationQueue();',q)
          assert a < b < c < q < z
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-V-DRAW'
      - name: Frozen cluster
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          assert 'Rev35R004BudgetMaximumMilliseconds = 2.00' in r
          assert 'Rev35R005SourceChunkHardCap = 64' in r
          assert 'presentationNow + 0.10f' in r
          assert 'foundationComplete = rendered && visible.FoundationComplete &&' in r
          assert 'lastBackFoundationCoverage >= 0.999f' in r
          assert 'readyFar >= visible.FarFoundationCount' in r
          assert 'Task.Run(' not in r and 'new Thread(' not in r and 'ThreadPool.' not in r
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-V-FROZEN'
