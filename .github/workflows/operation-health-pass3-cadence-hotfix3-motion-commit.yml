name: Operation Health Pass 3 Cadence Hotfix 3 Motion Commit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [cp3.75/nd-recovery]

permissions:
  contents: write
  pull-requests: read

jobs:
  hotfix:
    if: github.head_ref == 'automation/operation-health-pass3-cadence-hotfix3-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply exact 10 Hz moving-map FRONT commits
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          p=root/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'
          r=p.read_text()
          def once(old,new,label):
              global r
              if new in r: return
              if old not in r: raise SystemExit('anchor missing: '+label)
              r=r.replace(old,new,1)

          once('''        const float ProjectionRefreshAgeSeconds = 0.50f;\n        const float ProjectionRefreshHeadingDeg = 8f;\n        const float ReadyBuildingViolationSeconds = 1.0f;''', '''        const float ProjectionRefreshAgeSeconds = 0.50f;\n        const float ProjectionRefreshHeadingDeg = 8f;\n        // Cadence Hotfix 3: the 0.50s/large-distance rules remain safety/fallback\n        // authorities, but a genuinely moving map commits on every fixed 10 Hz\n        // authoritative tick. The speed guard prevents parked floating-origin noise\n        // from turning into needless BACK renders.\n        const float AuthoritativeMotionSpeedMetersPerSecond = 0.5f;\n        const double AuthoritativeMotionDistanceMeters = 0.01;\n        const double AuthoritativeMotionFallbackDistanceMeters = 0.25;\n        const float AuthoritativeMotionHeadingDeg = 0.05f;\n        const float ReadyBuildingViolationSeconds = 1.0f;''', 'motion constants')

          once('''        long operationHealthDirtyCommits;\n        long operationHealthObsoleteJobsCancelled;''', '''        long operationHealthDirtyCommits;\n        long operationHealthMotionRefreshes;\n        long operationHealthForcedProjectionRefreshes;\n        long operationHealthObsoleteJobsCancelled;''', 'motion telemetry counters')

          once('''            bool projectionRefreshRequired = NeedsProjectionRefresh(visible, vessel,\n                centerLatitudeDeg, centerLongitudeDeg, rangeMeters, mapHeadingDeg, trackUp,\n                anchorV, orientation);''', '''            bool forceCenterProjectionRefresh;\n            bool authoritativeMotionRefreshRequired = NeedsAuthoritativeMotionRefresh(\n                vessel, centerLatitudeDeg, centerLongitudeDeg, mapHeadingDeg, trackUp,\n                out forceCenterProjectionRefresh);\n            if (authoritativeMotionRefreshRequired) operationHealthMotionRefreshes++;\n            bool projectionRefreshRequired = authoritativeMotionRefreshRequired ||\n                NeedsProjectionRefresh(visible, vessel, centerLatitudeDeg,\n                    centerLongitudeDeg, rangeMeters, mapHeadingDeg, trackUp,\n                    anchorV, orientation);''', 'moving-map refresh request')

          r=r.replace('''                rendered = RenderBackBuffer(tiles, drawEntriesScratch, projection,\n                    mapRotation, effectiveMode, vessel, rangeMeters);''','''                rendered = RenderBackBuffer(tiles, drawEntriesScratch, projection,\n                    mapRotation, effectiveMode, vessel, rangeMeters,\n                    forceCenterProjectionRefresh);''')
          r=r.replace('''                bool recovered = RenderBackBuffer(tiles, drawEntriesScratch, projection,\n                    mapRotation, effectiveMode, vessel, rangeMeters);''','''                bool recovered = RenderBackBuffer(tiles, drawEntriesScratch, projection,\n                    mapRotation, effectiveMode, vessel, rangeMeters,\n                    forceCenterProjectionRefresh);''')

          once('''        bool RenderBackBuffer(AERISTerrainHeightTile[] tiles, Entry[] drawEntries,\n            AERISNdMapProjection projection, Matrix4x4 mapRotation,\n            AERISTerrainDisplayMode effectiveMode, Vessel vessel, float rangeMeters)\n        {''', '''        bool RenderBackBuffer(AERISTerrainHeightTile[] tiles, Entry[] drawEntries,\n            AERISNdMapProjection projection, Matrix4x4 mapRotation,\n            AERISTerrainDisplayMode effectiveMode, Vessel vessel, float rangeMeters,\n            bool forceCenterProjectionRefresh)\n        {\n            if (forceCenterProjectionRefresh)\n                operationHealthForcedProjectionRefreshes++;''', 'RenderBackBuffer force flag')

          once('''                    EnsureProjectedGeometry(drawEntry, projection,\n                        projectionThresholdMeters, projectionCenterLatitudeDeg,\n                        projectionCenterLongitudeDeg);''', '''                    EnsureProjectedGeometry(drawEntry, projection,\n                        projectionThresholdMeters, projectionCenterLatitudeDeg,\n                        projectionCenterLongitudeDeg, forceCenterProjectionRefresh);''', 'projection force forwarding')

          once('''        void EnsureProjectedGeometry(Entry entry,\n            AERISNdMapProjection context, float movementThresholdMeters,\n            double currentCenterLatitudeDeg, double currentCenterLongitudeDeg)\n        {\n            if (entry == null) return;\n            bool projectionChanged = double.IsNaN(entry.LastProjectionCenterLatitudeDeg) ||''', '''        void EnsureProjectedGeometry(Entry entry,\n            AERISNdMapProjection context, float movementThresholdMeters,\n            double currentCenterLatitudeDeg, double currentCenterLongitudeDeg,\n            bool forceCenterProjectionRefresh)\n        {\n            if (entry == null) return;\n            bool projectionChanged = forceCenterProjectionRefresh ||\n                double.IsNaN(entry.LastProjectionCenterLatitudeDeg) ||''', 'projection force consumption')

          anchor='''        bool NeedsProjectionRefresh(AERISTerrainVisibleTileSet visible, Vessel vessel,'''
          helper='''        bool NeedsAuthoritativeMotionRefresh(Vessel vessel,\n            double centerLatitudeDeg, double centerLongitudeDeg, float mapHeadingDeg,\n            bool trackUp, out bool forceCenterProjectionRefresh)\n        {\n            forceCenterProjectionRefresh = false;\n            if (!frontBufferValid || vessel == null || vessel.mainBody == null) return false;\n            double displacement = GreatCircleDistanceMeters(vessel.mainBody,\n                frontCenterLatitudeDeg, frontCenterLongitudeDeg, centerLatitudeDeg,\n                centerLongitudeDeg);\n            if (double.IsNaN(displacement) || double.IsInfinity(displacement)) return true;\n            bool speedConfirmedMotion = vessel.srfSpeed >=\n                AuthoritativeMotionSpeedMetersPerSecond &&\n                displacement >= AuthoritativeMotionDistanceMeters;\n            bool displacementConfirmedMotion = displacement >=\n                AuthoritativeMotionFallbackDistanceMeters;\n            forceCenterProjectionRefresh = speedConfirmedMotion ||\n                displacementConfirmedMotion;\n            bool headingMotion = trackUp && Mathf.Abs(Mathf.DeltaAngle(\n                frontMapHeadingDeg, mapHeadingDeg)) >= AuthoritativeMotionHeadingDeg;\n            return forceCenterProjectionRefresh || headingMotion;\n        }\n\n'''+anchor
          if 'bool NeedsAuthoritativeMotionRefresh(' not in r:
              if anchor not in r: raise SystemExit('anchor missing: motion helper')
              r=r.replace(anchor,helper,1)

          once('''                "; oh_dirty_commit=" + operationHealthDirtyCommits +\n                "; oh_obsolete_cancel=" + operationHealthObsoleteJobsCancelled +''', '''                "; oh_dirty_commit=" + operationHealthDirtyCommits +\n                "; oh_motion_refresh=" + operationHealthMotionRefreshes +\n                "; oh_forced_project=" + operationHealthForcedProjectionRefreshes +\n                "; oh_obsolete_cancel=" + operationHealthObsoleteJobsCancelled +''', 'motion telemetry log')
          p.write_text(r)

          h1=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix1.py'
          q=h1.read_text()
          q=q.replace("'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing'), 'runtime package identity is Cadence Hotfix 1 or approved successor')", "'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing', 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit'), 'runtime package identity is Cadence Hotfix 1 or approved successor')")
          h1.write_text(q)

          h2=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix2_refresh_coalescing.py'
          q=h2.read_text()
          q=q.replace("ck(V.get('NAME') == 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing', 'runtime identity is Hotfix 2 Refresh Coalescing')", "ck(V.get('NAME') in ('AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing', 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit'), 'runtime identity is Hotfix 2 or approved successor')")
          q=q.replace("ck('OPERATION HEALTH PASS 3 CADENCE HOTFIX 2 REFRESH COALESCING' in B, 'Ubuntu build entrypoint identifies Hotfix 2')", "ck('OPERATION HEALTH PASS 3 CADENCE HOTFIX' in B, 'Ubuntu build entrypoint identifies Cadence Hotfix lineage')")
          h2.write_text(q)

          test=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix3_motion_commit.py'
          test.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport json,sys\nsys.dont_write_bytecode=True\nROOT=Path(__file__).resolve().parents[1]\nR=(ROOT/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()\nS=(ROOT/'Source/AERISFlightControl/Settings/AERISSettings.cs').read_text()\nB=(ROOT/'build_ubuntu.sh').read_text()\nV=json.loads((ROOT/'GameData/AERISFlightControl/AERISFlightControl.version').read_text())\nchecks=[]\ndef ck(v,n): checks.append((bool(v),n)); print(('[PASS] ' if v else '[FAIL] ')+n)\nck('internal const float FixedNavigationDisplayUpdateHz = 10f' in S,'ND authority remains fixed 10 Hz')\nck('const float ProjectionRefreshAgeSeconds = 0.50f;' in R,'0.50s projection fallback remains intact')\nck('const float ProjectionRefreshHeadingDeg = 8f;' in R,'legacy 8 degree safety threshold remains intact')\nck('AuthoritativeMotionSpeedMetersPerSecond = 0.5f' in R and 'AuthoritativeMotionDistanceMeters = 0.01' in R,'moving-map 10 Hz motion guard exists')\nck('bool NeedsAuthoritativeMotionRefresh(' in R,'dedicated moving-map refresh path exists')\nhelper=R[R.index('bool NeedsAuthoritativeMotionRefresh('):R.index('bool NeedsProjectionRefresh(')]\nck('vessel.srfSpeed >=' in helper and 'GreatCircleDistanceMeters' in helper,'motion refresh is grounded in actual speed and displacement')\nck('AuthoritativeMotionHeadingDeg' in helper and 'trackUp' in helper,'TRK UP small heading motion participates in 10 Hz commits')\ndraw=R[R.index('internal AERISTerrainGpuDrawState Draw('):R.index('bool RenderBackBuffer(')]\nck('authoritativeMotionRefreshRequired ||' in draw and 'NeedsProjectionRefresh' in draw,'motion refresh augments rather than replaces fallback refresh authority')\nck('forceCenterProjectionRefresh' in draw,'moving-center force flag reaches renderer')\nrender=R[R.index('bool RenderBackBuffer('):R.index('bool DrawEntry(')]\nck('bool forceCenterProjectionRefresh' in render and 'operationHealthForcedProjectionRefreshes++' in render,'BACK render observes forced moving-center projection')\nproject=R[R.index('void EnsureProjectedGeometry('):R.index('void ProjectMesh(')]\nck('bool forceCenterProjectionRefresh' in project and 'bool projectionChanged = forceCenterProjectionRefresh ||' in project,'subpixel movement bypasses old 0.25px projection hold')\nck('nextAuthoritativePresentationTickRealtime = presentationNow + 0.10f' in R,'heavy pipeline remains bounded to authoritative 10 Hz')\nck('TryPresentCoalescedFront(plot, vessel)' in R,'non-tick Repaints still use cheap FRONT reuse')\nck('oh_motion_refresh=' in R and 'oh_forced_project=' in R,'motion-commit telemetry is published')\nck('RenderTextureFormat.ARGB32' in R and 'FilterMode.Bilinear' in R,'render-target quality authority unchanged')\nRA=(ROOT/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs').read_text()\nck('MaximumContourLevelsPerTile = 96' in RA and 'MaximumSparseCorrectionParentCells = 256' in RA,'Candidate11 contour/coastal safety authorities unchanged')\nck(V.get('NAME') == 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','runtime identity is Hotfix 3 Motion Commit')\nck('OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT' in B,'Ubuntu build identifies Hotfix 3 Motion Commit')\nfailed=[n for ok,n in checks if not ok]\nprint('\\n[Operation Health Pass 3 Cadence Hotfix 3 Motion Commit] %d/%d PASS' % (len(checks)-len(failed),len(checks)))\nif failed: print('FAILED: '+', '.join(failed)); raise SystemExit(1)\n''')

          runner=root/'Tools/run_v01800_operation_health_pass3_prebuild.py'
          q=runner.read_text()
          old="suites=[\n ('Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing','selftest_v01800_operation_health_pass3_cadence_hotfix2_refresh_coalescing.py'),"
          new="suites=[\n ('Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','selftest_v01800_operation_health_pass3_cadence_hotfix3_motion_commit.py'),\n ('Operation Health Pass 3 Cadence Hotfix 2 Refresh Coalescing','selftest_v01800_operation_health_pass3_cadence_hotfix2_refresh_coalescing.py'),"
          if new not in q:
              if old not in q: raise SystemExit('prebuild anchor missing')
              q=q.replace(old,new,1)
          runner.write_text(q)

          version=root/'GameData/AERISFlightControl/AERISFlightControl.version'
          v=json.loads(version.read_text()); v['NAME']='AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit'; version.write_text(json.dumps(v,indent=2)+'\n')
          gen=root/'Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs'
          g=gen.read_text().replace('OPERATION HEALTH PASS 3 CADENCE HOTFIX 2 REFRESH COALESCING','OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT').replace('OPERATION HEALTH PASS 3 CADENCE HOTFIX 2 REFRESH COALESCING','OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT')
          gen.write_text(g)
          build=root/'build_ubuntu.sh'; b=build.read_text().replace('OPERATION HEALTH PASS 3 CADENCE HOTFIX 2 REFRESH COALESCING','OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT'); build.write_text(b)
          doc=root/'Docs/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX3_MOTION_COMMIT_ja.md'
          doc.write_text('''# Operation Health Pass 3 Cadence Hotfix 3 / Motion Commit\n\nHotfix 2の10 Hz authoritative pipelineを維持しつつ、実移動中のFRONT projectionを各authoritative tickでcommitする。停止中は従来のdirty/age fallbackへ戻り、不要な10 Hz BACK renderを発生させない。\n\n- moving map: exact FRONT commit target = 10 Hz\n- parked map: no forced commit\n- worker/tile generation cadence: unchanged\n- non-tick Repaint: cheap FRONT reuse only\n- Candidate11 visual authority: unchanged\n- 0.50s projection fallback and 8deg safety threshold: retained\n''')
          PY
          PATCH_RC=$?
          if [ "$PATCH_RC" -ne 0 ]; then echo "HOTFIX3_SAFE_STOP_PATCH_FAILED rc=$PATCH_RC"; exit 1; fi
          python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          TEST_RC=$?
          if [ "$TEST_RC" -ne 0 ]; then echo "HOTFIX3_SAFE_STOP_PREBUILD_FAILED rc=$TEST_RC"; exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/operation-health-pass3-cadence-hotfix3-motion-commit.yml
          cat > Evidence/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX3_MOTION_COMMIT_STATIC_VALIDATION.txt <<'EOF'
          Operation Health Pass 3 Cadence Hotfix 3 Motion Commit static validation
          authoritative_pipeline_hz=10
          moving_front_commit_target_hz=10
          parked_forced_back_render=NO
          subpixel_projection_hold_bypassed_when_moving=YES
          projection_age_fallback_seconds=0.50
          visual_authority_changed=NO
          prebuild=PASS
          runtime_ksp=UNVERIFIED
          release_candidate=NO_UNTIL_RUNTIME_PASS
          EOF
          git add -A
          git commit -m 'Fix moving ND FRONT commits at authoritative 10 Hz'
          git push origin HEAD:cp3.75/nd-recovery
