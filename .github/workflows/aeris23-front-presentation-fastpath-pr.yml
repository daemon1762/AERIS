name: AERIS23 FRONT Presentation Fast Path

on:
  pull_request:
    branches:
      - cp3.75/nd-recovery

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/aeris23-front-presentation-10hz-fastpath'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aeris23-front-presentation-10hz-fastpath
          fetch-depth: 0
      - name: Apply fast path patch
        run: python3 Tools/aeris23_front_presentation_fastpath_patch.py
      - name: Static regression tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          git diff --check
      - name: Commit verified fast path
        run: |
          git config user.name 'AERIS Patch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/aeris23-front-presentation-fastpath-pr.yml Tools/aeris23_front_presentation_fastpath_patch.py
          git add Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs Tools/selftest_v01800_operation_health_front_presentation_fastpath.py Tools/run_v01800_operation_health_pass3_prebuild.py
          git commit -m 'Reduce retained FRONT presentation overhead [front-fastpath-applied]'
          git push origin HEAD:agent/aeris23-front-presentation-10hz-fastpath
