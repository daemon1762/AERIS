name: Operation Health Pass 2 Finalize
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply finalization
        run: python3 Tools/_operation_health_pass2_finalize.py
      - name: Run static acceptance suites
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass2_prebuild.py | tee /tmp/operation_health_pass2_prebuild.log
      - name: Parse changed C# sources
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-c-sharp
          python3 - <<'PY' | tee /tmp/operation_health_pass2_csharp_parse.log
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          language=Language(tree_sitter_c_sharp.language())
          parser=Parser(language)
          files=[
              Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs'),
              Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'),
              Path('Source/AERISFlightControl/UI/AERISNavigationDisplay.cs'),
          ]
          failed=[]
          for path in files:
              tree=parser.parse(path.read_bytes())
              ok=not tree.root_node.has_error
              print(('[PASS] ' if ok else '[FAIL] ')+str(path))
              if not ok: failed.append(str(path))
          if failed: raise SystemExit('C# parse failed: '+', '.join(failed))
          print('[Operation Health Pass 2 C# syntax] 3/3 PASS')
          PY
      - name: Write validation evidence
        run: |
          {
            echo 'Operation Health Pass 2 GitHub static validation'
            echo 'prebuild=PASS'
            echo 'csharp_tree_sitter=PASS'
            echo 'visual_authority_changed=NO'
            echo 'runtime_ksp=UNVERIFIED'
          } > Evidence/OPERATION_HEALTH_PASS2_GITHUB_STATIC_VALIDATION.txt
      - name: Commit finalized candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs build_ubuntu.sh Evidence/OPERATION_HEALTH_PASS2_GITHUB_STATIC_VALIDATION.txt
          git diff --cached --quiet || git commit -m 'Finalize Operation Health Pass 2 persistent geometry'
          git push origin HEAD:cp3.75/nd-recovery
