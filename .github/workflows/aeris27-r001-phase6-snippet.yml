name: AERIS27 R001 Phase6 Snippet

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-resumable-prepare-r001
  workflow_dispatch:

jobs:
  phase6-snippet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct accepted lineage through REV003
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_003_inherited_selftests.py >/dev/null
      - name: Print exact REV003 Prepare snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs')
          s = p.read_text()
          for needle, before, after in [
              ('case PendingEntryCommitStage.PrepareSources:', 300, 700),
              ('case PendingEntryCommitStage.PreparePackedTerrain:', 300, 900),
              ('void PreparePendingSources(PendingEntryCommit pending)', 200, 2600),
              ('void PreparePendingPackedTerrain(PendingEntryCommit pending)', 200, 4200),
          ]:
              i = s.find(needle)
              print('\n===== ' + needle + ' @ ' + str(i) + ' =====')
              if i < 0:
                  print('NOT FOUND')
              else:
                  print(s[max(0, i-before):i+after])
          PY
