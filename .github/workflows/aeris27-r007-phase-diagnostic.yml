name: AERIS27 R007 Phase Diagnostic

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r007-foundation-chained-admission
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/apply_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py Tools/verify_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py
          rm -rf Tools/__pycache__
      - name: Mark syntax
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-DIAG-SYNTAX'
      - name: Reconstruct parents
        run: |
          set -euo pipefail
          for s in \
            apply_aeris25_gpu_dynamic_terrain_colour_ready.py \
            apply_aeris25_chunk_cull_guard_hotfix.py \
            apply_aeris25_temporal_foundation_overscan_hotfix.py \
            apply_aeris25_foundation_cull_bypass_hotfix.py \
            apply_aeris25_renderable_entry_gate_hotfix.py \
            apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py \
            apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py \
            apply_aeris25_content_generation_burst_governor_hotfix.py \
            apply_aeris25_persistent_presentation_batching.py \
            apply_aeris25_main_thread_commit_governor.py \
            apply_aeris25_staged_main_thread_commit_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            apply_aeris25_authoritative_publication_lifetime_hotfix.py \
            fix_aeris25_phase6_002_inherited_selftests.py \
            fix_aeris25_phase6_003_inherited_selftests.py \
            apply_aeris26_rev003_observer.py \
            apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py \
            apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py \
            apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py \
            apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py \
            apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py \
            apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py \
            apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py \
            apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py \
            apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py \
            apply_aeris27_rev3_5_salbutamol_r006_packed_managed_buffer_reuse_hotfix4.py; do
              PYTHONDONTWRITEBYTECODE=1 python3 "Tools/$s" >/dev/null
          done
      - name: Mark parent
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-DIAG-PARENT'
      - name: Apply R007
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py
      - name: Mark apply
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-DIAG-APPLY'
      - name: Verify R007
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris27_rev3_5_salbutamol_r007_foundation_chained_admission.py
      - name: Mark verifier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AERIS27/R007-DIAG-VERIFY'
