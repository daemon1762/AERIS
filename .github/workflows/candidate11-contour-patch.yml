name: Candidate11 contour patch
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply Candidate11 patch
        run: python3 Tools/_candidate11_apply_contour_patch.py
      - name: Validate Candidate11 static acceptance
        run: python3 Tools/selftest_v01800_cp375_candidate11_contour_level_budget_coastal_clip.py
      - name: Commit and self-delete
        run: |
          rm -f .github/workflows/candidate11-contour-patch.yml
          rm -f Tools/_candidate11_apply_contour_patch.py
          rm -f Evidence/CANDIDATE11_PATCH_TRIGGER.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "CP3.75 Candidate11 rebuild contour level budget and coastal clipping"
          git push origin HEAD:cp3.75/nd-recovery
