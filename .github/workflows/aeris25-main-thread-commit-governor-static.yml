name: AERIS25 Main Thread Commit Governor Static

on:
  push:
    branches:
      - agent/aeris25-main-thread-commit-governor
  pull_request:
    branches:
      - agent/aeris25-persistent-presentation-batching

jobs:
  main-thread-commit-governor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NOREPINEPHRINE script syntax
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_main_thread_commit_governor.py \
            Tools/verify_aeris25_main_thread_commit_governor.py \
            Tools/prepare_aeris25_main_thread_commit_governor_runtime.py

      - name: Reconstruct accepted ADENOSINE and verify NOREPINEPHRINE Phase 6
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LOG=aeris25_main_thread_commit_governor_static.log

          echo '=== AERIS25-1 ATROPINE LINEAGE ===' | tee "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== ATROPINE REV009 ACCEPTED PRE-PROMOTION PASS ===' | tee -a "$LOG"

          echo '=== AERIS25-2 ADENOSINE OH_PHASE5_001 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          echo '=== ADENOSINE ACCEPTED PRE-PROMOTION PASS ===' | tee -a "$LOG"

          echo '=== AERIS25-3 NOREPINEPHRINE OH_PHASE6_001 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"

          echo '=== PHASE6 INHERITED CONTRACT MATRIX ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

          echo '=== NOREPINEPHRINE IDEMPOTENT RE-ENTRY ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"
          git diff --check

          grep -Fq '[AERIS25 NOREPINEPHRINE PHASE6_001 MAIN THREAD COMMIT GOVERNOR] STATIC PASS' "$LOG"
          grep -Fq 'measured-time commit governor already present' "$LOG"
          grep -Fq '[Operation Health Pass 3 PREBUILD] 20/20 suites PASS' "$LOG"

      - name: Upload NOREPINEPHRINE static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-main-thread-commit-governor-static-log
          path: |
            aeris25_main_thread_commit_governor_static.log
            Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
            Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
            GameData/AERISFlightControl/Config/AERISOperationHealth.cfg
            Tools/verify_aeris25_persistent_presentation_batching.py
            Tools/selftest_v01800_operation_health_step2_motion_content_coastal_refinement.py
            build_ubuntu.sh
          if-no-files-found: error

      - name: Fail if NOREPINEPHRINE static gate failed
        if: steps.candidate.outcome == 'failure'
        shell: bash
        run: |
          tail -n 400 aeris25_main_thread_commit_governor_static.log || true
          exit 1
