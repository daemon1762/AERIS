name: Candidate9 one-shot source patch

on:
  push:
    branches:
      - cp3.75/nd-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply Candidate9 renderer patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        long frontContentRevision;\n        long lastBackAttemptViewGeneration = -1L;',
              '        long frontContentRevision;\n'
              '        // Candidate9: a FRONT is authoritative only for the colour mode/preset\n'
              '        // with which it was rendered. Palette or AUTO REL/TOPO transitions\n'
              '        // must never present a stale texture under new annunciation state.\n'
              '        AERISTerrainDisplayMode frontColourMode = (AERISTerrainDisplayMode)(-1);\n'
              '        AERISTerrainColourPreset frontColourPreset = (AERISTerrainColourPreset)(-1);\n'
              '        long lastBackAttemptViewGeneration = -1L;',
              'front colour state fields')

          replace_once(
              '            AERISTerrainDisplayMode effectiveMode = ResolveEffectiveMode(requestedMode,\n'
              '                vessel, rangeMeters);\n'
              '            AERISTerrainVirtualDetailProfile virtualDetail =',
              '            AERISTerrainDisplayMode effectiveMode = ResolveEffectiveMode(requestedMode,\n'
              '                vessel, rangeMeters);\n'
              '            AERISTerrainColourPreset currentPreset = settings == null ?\n'
              '                AERISTerrainColourPreset.Standard : settings.TerrainColourPreset;\n'
              '            AERISTerrainVirtualDetailProfile virtualDetail =',
              'current preset authority')

          replace_once(
              '            EnsureResources(plot, effectiveMode,\n'
              '                settings == null ? AERISTerrainColourPreset.Standard :\n'
              '                settings.TerrainColourPreset, virtualDetail);',
              '            EnsureResources(plot, effectiveMode, currentPreset, virtualDetail);',
              'resource preset authority')

          replace_once(
              '            bool refreshRequired = !frontBufferValid ||\n'
              '                frontTerrainGeneration != visible.TerrainGeneration ||\n'
              '                frontViewGeneration != visible.ViewGeneration ||\n'
              '                frontContentRevision != gpuContentRevision ||\n'
              '                projectionRefreshRequired;',
              '            bool colourRefreshRequired = frontColourMode != effectiveMode ||\n'
              '                frontColourPreset != currentPreset;\n'
              '            bool refreshRequired = !frontBufferValid ||\n'
              '                frontTerrainGeneration != visible.TerrainGeneration ||\n'
              '                frontViewGeneration != visible.ViewGeneration ||\n'
              '                frontContentRevision != gpuContentRevision ||\n'
              '                colourRefreshRequired || projectionRefreshRequired;',
              'refresh colour authority')

          swap = ('                    SwapFrontAndBack(visible, vessel, centerLatitudeDeg,\n'
                  '                        centerLongitudeDeg, rangeMeters, rangeMeters,\n'
                  '                        mapHeadingDeg, trackUp, anchorV, orientation);')
          swap_new = (swap + '\n'
                      '                    frontColourMode = effectiveMode;\n'
                      '                    frontColourPreset = currentPreset;')
          if text.count(swap) != 2:
              raise SystemExit(f'swap colour commit: expected 2 matches, found {text.count(swap)}')
          text = text.replace(swap, swap_new)

          replace_once(
              '            bool directCompatible = IsFrontBufferCompatible(visible, vessel,\n'
              '                centerLatitudeDeg, centerLongitudeDeg, rangeMeters, mapHeadingDeg,\n'
              '                trackUp, anchorV, orientation);',
              '            bool colourCompatible = frontColourMode == effectiveMode &&\n'
              '                frontColourPreset == currentPreset;\n'
              '            bool directCompatible = colourCompatible &&\n'
              '                IsFrontBufferCompatible(visible, vessel, centerLatitudeDeg,\n'
              '                    centerLongitudeDeg, rangeMeters, mapHeadingDeg, trackUp,\n'
              '                    anchorV, orientation);',
              'direct front colour compatibility')

          replace_once(
              '            if (!present && CanPresentLatchedFront(visible, vessel))',
              '            if (!present && colourCompatible &&\n'
              '                CanPresentLatchedFront(visible, vessel))',
              'latched front colour compatibility')

          # All diagnostic calls use the exact preset authority resolved for this frame.
          text = text.replace(
              '                    effectiveMode, settings == null ? AERISTerrainColourPreset.Standard :\n'
              '                    settings.TerrainColourPreset, lockReference);',
              '                    effectiveMode, currentPreset, lockReference);')

          replace_once(
              '            frontContentRevision = -1L;\n            lastBackAttemptViewGeneration = -1L;',
              '            frontContentRevision = -1L;\n'
              '            frontColourMode = (AERISTerrainDisplayMode)(-1);\n'
              '            frontColourPreset = (AERISTerrainColourPreset)(-1);\n'
              '            lastBackAttemptViewGeneration = -1L;',
              'reset front colour state')

          replace_once(
              '                if (preset == AERISTerrainColourPreset.HighContrast)\n'
              '                    return new Color32(0, 190, 255, 255);',
              '                if (preset == AERISTerrainColourPreset.HighContrast)\n'
              '                    return new Color32(70, 235, 70, 255);',
              'HighContrast REL green band')
          replace_once(
              '            if (preset == AERISTerrainColourPreset.HighContrast)\n'
              '                return new Color32(0, 20, 12, 255);',
              '            if (preset == AERISTerrainColourPreset.HighContrast)\n'
              '                return new Color32(12, 72, 24, 255);',
              'HighContrast REL distant green')

          path.write_text(text, encoding='utf-8')

          # One-shot workflow removes itself from the resulting source commit.
          Path('.github/workflows/candidate9-one-shot.yml').unlink()

      - name: Static source assertions
        shell: python
        run: |
          from pathlib import Path
          r = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          p = Path('Source/AERISFlightControl/Terrain/AERISTerrainCoastlinePolicy.cs').read_text()
          q = Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs').read_text()
          checks = {
              'HC cyan removed': 'new Color32(0, 190, 255, 255)' not in r,
              'HC REL green': 'new Color32(70, 235, 70, 255)' in r and 'new Color32(12, 72, 24, 255)' in r,
              'front colour state': 'frontColourMode' in r and 'frontColourPreset' in r and 'colourCompatible' in r,
              'unified edge authority': 'return CrossingFraction(water0, water1);' in p,
              'sparse 256 rail': 'MaximumSparseCorrectionParentCells = 256' in q,
              'no whole HD surface promotion': 'resolution = highDensityBoundary' not in q,
          }
          bad = [k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('[PASS] ' if v else '[FAIL] ') + k)
          if bad: raise SystemExit('Candidate9 static assertion failure: ' + ', '.join(bad))
      - name: Commit Candidate9 source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete CP3.75 Candidate9 renderer authority fixes"
          git push origin HEAD:cp3.75/nd-recovery
