name: AERIS25 Content Generation Burst Governor Static

on:
  push:
    branches:
      - agent/aeris25-gpu-dynamic-terrain-colour
  pull_request:
    branches:
      - agent/aeris24-gpu-vertex-projection-poc

jobs:
  burst-governor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rev009 script syntax
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_content_generation_burst_governor_hotfix.py \
            Tools/verify_aeris25_content_generation_burst_governor_hotfix.py \
            Tools/prepare_aeris25_content_generation_burst_governor_runtime.py

      - name: Generate and verify ATROPINE rev009
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LOG=aeris25_content_generation_burst_governor_static.log

          echo '=== REV002 BASELINE ===' | tee "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py 2>&1 | tee -a "$LOG"
          echo '=== REV003 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== REV004 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== REV005 HISTORICAL ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== REV006 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== REV007 DIAGNOSTICS ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"

          echo '=== REV008 SNAPSHOT MESH LIFETIME ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"

          echo '=== REV009 CONTENT GENERATION BURST GOVERNOR ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"

          echo '=== REV009 IDEMPOTENT RE-ENTRY ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"

          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"
          git diff --check

          grep -Fq '[AERIS25 ATROPINE REV009 CONTENT GENERATION BURST GOVERNOR] STATIC PASS' "$LOG"
          grep -Fq 'content generation burst governor already present' "$LOG"
          grep -Fq '[AERIS25 ATROPINE REV009 INHERITED] FINAL-TREE VERIFIER MATRIX PASS' "$LOG"
          grep -Fq '[Operation Health Pass 3 PREBUILD] 20/20 suites PASS' "$LOG"

      - name: Upload rev009 static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-content-generation-burst-governor-static-log
          path: |
            aeris25_content_generation_burst_governor_static.log
            Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
            Source/AERISFlightControl/Terrain/AERISTerrainTileSystem.cs
            Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
            build_ubuntu.sh
          if-no-files-found: error

      - name: Fail if rev009 static gate failed
        if: steps.candidate.outcome == 'failure'
        shell: bash
        run: |
          tail -n 300 aeris25_content_generation_burst_governor_static.log || true
          exit 1
