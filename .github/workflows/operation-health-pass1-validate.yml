name: Operation Health Pass 1 Validate
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Static prebuild suites
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass1_prebuild.py
      - name: CSharp syntax parse
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-c-sharp
          python3 - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser=Parser(Language(tree_sitter_c_sharp.language()))
          for p in [
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'),
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs'),
            Path('Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs')]:
            tree=parser.parse(p.read_bytes())
            if tree.root_node.has_error:
              raise SystemExit('C# syntax parse failed: '+str(p))
            print('PASS',p)
          PY
      - name: Evidence and cleanup
        run: |
          cat > Evidence/OPERATION_HEALTH_PASS1_GITHUB_STATIC_VALIDATION.txt <<'EOF'
          Operation Health Pass 1 GitHub validation:
          zero-visual-cost renderer selftest: PASS
          Candidate11 contour authority inheritance: PASS
          CP2 compile-regression static suite: PASS
          tree-sitter C# syntax: PASS
          EOF
          rm -f .github/workflows/operation-health-pass1-validate.yml
          rm -f Evidence/OPERATION_HEALTH_PASS1_VALIDATE_TRIGGER.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate Operation Health pass 1"
          git push origin HEAD:cp3.75/nd-recovery
