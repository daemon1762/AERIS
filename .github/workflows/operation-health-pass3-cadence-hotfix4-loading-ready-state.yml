name: Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
  pull-requests: read
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Separate requested-view READY from continuity presentation
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          p=root/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'
          r=p.read_text()
          def once(old,new,label):
              global r
              if new in r: return
              if old not in r: raise SystemExit('anchor missing: '+label)
              r=r.replace(old,new,1)

          once('''        long frontContentRevision;\n        bool gpuContentDirty;''','''        long frontContentRevision;\n        bool gpuContentDirty;\n        // Cadence Hotfix 4: presentation continuity and requested-view readiness are\n        // different states. A stale/latched FRONT may remain visible as a backdrop while\n        // the newly requested range/view is still BUILDING.\n        bool requestedViewReady;''','requested-view ready field')

          once('''        long operationHealthMotionRefreshes;\n        long operationHealthForcedProjectionRefreshes;\n        long operationHealthObsoleteJobsCancelled;''','''        long operationHealthMotionRefreshes;\n        long operationHealthForcedProjectionRefreshes;\n        long operationHealthLoadingBackdropFrames;\n        long operationHealthRequestedViewReadyTransitions;\n        long operationHealthObsoleteJobsCancelled;''','loading telemetry counters')

          once('''        internal AERISTerrainGpuDrawState LastDrawState { get { return lastDrawState; } }\n        internal float LastRunwayMapLockErrorPixels''','''        internal AERISTerrainGpuDrawState LastDrawState { get { return lastDrawState; } }\n        internal bool RequestedViewReady { get { return requestedViewReady; } }\n        internal float LastRunwayMapLockErrorPixels''','requested-view ready property')

          once('''            rasterizer.CancelAll();\n            requested.Clear();\n            scheduledThisFrame.Clear();\n            // Do not reset nextAuthoritativePresentationTickRealtime here.''','''            rasterizer.CancelAll();\n            requested.Clear();\n            scheduledThisFrame.Clear();\n            // The previous FRONT is intentionally retained as a continuity backdrop, but\n            // it no longer satisfies the newly requested range/view. Reset only the new\n            // view progress/readiness authority so UI shows BUILDING immediately.\n            requestedViewReady = false;\n            lastBackFoundationCoverage = 0f;\n            lastCoverageFraction = 0f;\n            lastDrawState = AERISTerrainGpuDrawState.Partial;\n            // Do not reset nextAuthoritativePresentationTickRealtime here.''','view invalidation readiness reset')

          once('''            frontContentRevision = gpuContentRevision;\n            if (gpuContentDirty) operationHealthDirtyCommits++;\n            gpuContentDirty = false;\n            frontBufferSwaps++;''','''            frontContentRevision = gpuContentRevision;\n            if (!requestedViewReady) operationHealthRequestedViewReadyTransitions++;\n            requestedViewReady = true;\n            if (gpuContentDirty) operationHealthDirtyCommits++;\n            gpuContentDirty = false;\n            frontBufferSwaps++;''','ready transition on exact FRONT swap')

          once('''            operationHealthCoalescedPresentFrames++;\n            return true;''','''            operationHealthCoalescedPresentFrames++;\n            if (!requestedViewReady) operationHealthLoadingBackdropFrames++;\n            return true;''','non-tick loading backdrop telemetry')

          once('''            LogGpuOnlyPresentation(visible, readyGlobal, readyFar, swapped);\n            lastDrawState = present ? AERISTerrainGpuDrawState.Complete :\n                AERISTerrainGpuDrawState.Partial;''','''            if (present && !requestedViewReady) operationHealthLoadingBackdropFrames++;\n            LogGpuOnlyPresentation(visible, readyGlobal, readyFar, swapped);\n            // A continuity FRONT is allowed to remain visible, but only an exact FRONT\n            // committed for the currently requested view may report Complete.\n            lastDrawState = present && requestedViewReady ?\n                AERISTerrainGpuDrawState.Complete : AERISTerrainGpuDrawState.Partial;''','draw state separates presentation and ready')

          once('''                "; oh_forced_project=" + operationHealthForcedProjectionRefreshes +\n                "; oh_obsolete_cancel=" + operationHealthObsoleteJobsCancelled +''','''                "; oh_forced_project=" + operationHealthForcedProjectionRefreshes +\n                "; oh_loading_backdrop=" + operationHealthLoadingBackdropFrames +\n                "; oh_ready_transition=" + operationHealthRequestedViewReadyTransitions +\n                "; requested_view_ready=" + (requestedViewReady ? "1" : "0") +\n                "; oh_obsolete_cancel=" + operationHealthObsoleteJobsCancelled +''','loading telemetry log')

          once('''            nextAuthoritativePresentationTickRealtime = 0f;\n            gpuContentDirty = false;\n            lastFrontBufferPresented = false;''','''            nextAuthoritativePresentationTickRealtime = 0f;\n            gpuContentDirty = false;\n            requestedViewReady = false;\n            lastFrontBufferPresented = false;''','front lifecycle readiness reset')
          p.write_text(r)

          # New acceptance test.
          t=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix4_loading_ready_state.py'
          t.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport json,sys\nsys.dont_write_bytecode=True\nROOT=Path(__file__).resolve().parents[1]\nR=(ROOT/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()\nN=(ROOT/'Source/AERISFlightControl/UI/AERISNavigationDisplay.cs').read_text()\nB=(ROOT/'build_ubuntu.sh').read_text()\nV=json.loads((ROOT/'GameData/AERISFlightControl/AERISFlightControl.version').read_text())\nchecks=[]\ndef ck(v,n): checks.append((bool(v),n)); print(('[PASS] ' if v else '[FAIL] ')+n)\nck('bool requestedViewReady;' in R and 'internal bool RequestedViewReady' in R,'requested-view READY is independent renderer state')\ninv=R[R.index('internal void InvalidatePendingForViewChange'):R.index('internal void SuspendViewport') ]\nck('requestedViewReady = false;' in inv and 'lastDrawState = AERISTerrainGpuDrawState.Partial;' in inv,'view invalidation immediately becomes BUILDING/Partial')\nck('lastBackFoundationCoverage = 0f;' in inv and 'lastCoverageFraction = 0f;' in inv,'new-view loading progress resets instead of inheriting stale 99 percent')\nck('ReleaseGpuResources' not in inv and 'ResetFrontBufferState' not in inv,'view invalidation retains old FRONT as continuity backdrop')\nswap=R[R.index('void SwapFrontAndBack('):R.index('bool IsFrontBufferCompatible(')]\nck('requestedViewReady = true;' in swap and 'operationHealthRequestedViewReadyTransitions++' in swap,'only exact FRONT swap transitions requested view to READY')\nfast=R[R.index('bool TryPresentCoalescedFront('):R.index('void MarkGpuContentDirty(')]\nck('requestedViewReady = true' not in fast and 'operationHealthLoadingBackdropFrames++' in fast,'cheap non-tick FRONT reuse cannot falsely declare READY')\nend=R[R.index('UpdateReadyBuildingWatchdog(present'):R.index('bool RenderBackBuffer(')]\nck('present && requestedViewReady' in end and 'AERISTerrainGpuDrawState.Partial' in end,'visible stale FRONT reports Partial until requested view is READY')\nreset=R[R.index('void ResetFrontBufferState()'):R.index('void Schedule(')]\nck('requestedViewReady = false;' in reset,'true FRONT lifecycle reset clears requested-view READY')\nck('oh_loading_backdrop=' in R and 'oh_ready_transition=' in R and 'requested_view_ready=' in R,'runtime loading/readiness telemetry is published')\nck('if (gpuState == AERISTerrainGpuDrawState.Partial)' in N and 'TERRAIN GPU BUILDING ' in N,'ND UI renders BUILDING for renderer Partial state')\nck('terrainTileRenderer.InvalidatePendingForViewChange();' in N and 'RangeChangeDebounceSeconds = 0.35f' in N,'coalesced range changes enter requested-view invalidation path')\nck('return Time.realtimeSinceStartup - frontCommittedRealtime <= 8.0f;' in R,'existing stale-FRONT continuity safety window remains unchanged')\nck('nextAuthoritativePresentationTickRealtime = presentationNow + 0.10f' in R,'10 Hz authoritative cadence remains unchanged')\nck('AuthoritativeMotionSpeedMetersPerSecond = 0.5f' in R and 'forceCenterProjectionRefresh' in R,'Hotfix 3 exact moving-map 10 Hz path remains intact')\nck('RenderTextureFormat.ARGB32' in R and 'FilterMode.Bilinear' in R,'render-target visual quality authority unchanged')\nRA=(ROOT/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs').read_text()\nck('MaximumContourLevelsPerTile = 96' in RA and 'MaximumSparseCorrectionParentCells = 256' in RA,'Candidate11 contour/coastal authorities unchanged')\nck(V.get('NAME') == 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State','runtime identity is Hotfix 4 Loading Ready State')\nck('OPERATION HEALTH PASS 3 CADENCE HOTFIX 4 LOADING READY STATE' in B,'Ubuntu build identifies Hotfix 4 Loading Ready State')\nfailed=[n for ok,n in checks if not ok]\nprint('\\n[Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State] %d/%d PASS' % (len(checks)-len(failed),len(checks)))\nif failed: print('FAILED: '+', '.join(failed)); raise SystemExit(1)\n''')

          # Preserve lineage tests by accepting the approved successor identity.
          h1=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix1.py'
          q=h1.read_text()
          q=q.replace("'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit'), 'runtime package identity is Cadence Hotfix 1 or approved successor')", "'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit', 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State'), 'runtime package identity is Cadence Hotfix 1 or approved successor')")
          h1.write_text(q)
          h2=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix2_refresh_coalescing.py'
          q=h2.read_text()
          q=q.replace("'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit'), 'runtime identity is Hotfix 2 or approved successor')", "'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit', 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State'), 'runtime identity is Hotfix 2 or approved successor')")
          h2.write_text(q)
          h3=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix3_motion_commit.py'
          q=h3.read_text()
          q=q.replace("ck(V.get('NAME') == 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','runtime identity is Hotfix 3 Motion Commit')", "ck(V.get('NAME') in ('AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State'),'runtime identity is Hotfix 3 or approved successor')")
          q=q.replace("ck('OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT' in B,'Ubuntu build identifies Hotfix 3 Motion Commit')", "ck('OPERATION HEALTH PASS 3 CADENCE HOTFIX' in B,'Ubuntu build identifies Cadence Hotfix lineage')")
          h3.write_text(q)

          runner=root/'Tools/run_v01800_operation_health_pass3_prebuild.py'
          q=runner.read_text()
          old="suites=[\n ('Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','selftest_v01800_operation_health_pass3_cadence_hotfix3_motion_commit.py'),"
          new="suites=[\n ('Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State','selftest_v01800_operation_health_pass3_cadence_hotfix4_loading_ready_state.py'),\n ('Operation Health Pass 3 Cadence Hotfix 3 Motion Commit','selftest_v01800_operation_health_pass3_cadence_hotfix3_motion_commit.py'),"
          if new not in q:
              if old not in q: raise SystemExit('prebuild anchor missing')
              q=q.replace(old,new,1)
          runner.write_text(q)

          version=root/'GameData/AERISFlightControl/AERISFlightControl.version'
          v=json.loads(version.read_text()); v['NAME']='AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State'; version.write_text(json.dumps(v,indent=2)+'\n')
          gen=root/'Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs'
          g=gen.read_text().replace('OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT','OPERATION HEALTH PASS 3 CADENCE HOTFIX 4 LOADING READY STATE')
          gen.write_text(g)
          build=root/'build_ubuntu.sh'; b=build.read_text().replace('OPERATION HEALTH PASS 3 CADENCE HOTFIX 3 MOTION COMMIT','OPERATION HEALTH PASS 3 CADENCE HOTFIX 4 LOADING READY STATE'); build.write_text(b)

          doc=root/'Docs/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX4_LOADING_READY_STATE_ja.md'
          doc.write_text('''# Operation Health Pass 3 Cadence Hotfix 4 / Loading Ready State\n\n表示可能な旧FRONTと、現在要求中のRange/ViewがREADYであることを分離する。\n\n- range/view invalidation: requestedViewReady=false / progress=0 / Partial\n- stale FRONT: continuity backdropとして保持可能\n- UI: Partialの間は `TERRAIN GPU BUILDING xx%` を表示\n- exact current-view FRONT swap: requestedViewReady=true / Complete\n- non-tick cheap FRONT reuse: READY状態を変更しない\n- 10 Hz Motion Commit / Candidate11 visual authority: unchanged\n''')
          PY
          PATCH_RC=$?
          if [ "$PATCH_RC" -ne 0 ]; then echo "HOTFIX4_SAFE_STOP_PATCH_FAILED rc=$PATCH_RC"; exit 1; fi
          python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          TEST_RC=$?
          if [ "$TEST_RC" -ne 0 ]; then echo "HOTFIX4_SAFE_STOP_PREBUILD_FAILED rc=$TEST_RC"; exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/operation-health-pass3-cadence-hotfix4-loading-ready-state.yml
          cat > Evidence/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX4_LOADING_READY_STATE_STATIC_VALIDATION.txt <<'EOF'
          Operation Health Pass 3 Cadence Hotfix 4 Loading Ready State static validation
          requested_view_ready_state=SEPARATE_FROM_PRESENTATION
          stale_front_continuity_backdrop=RETAINED
          range_invalidation_immediate_building=YES
          stale_progress_inheritance=NO
          non_tick_front_reuse_can_declare_ready=NO
          exact_front_swap_declares_ready=YES
          authoritative_pipeline_hz=10
          hotfix3_motion_commit=RETAINED
          visual_authority_changed=NO
          prebuild=PASS
          runtime_ksp=UNVERIFIED
          release_candidate=NO_UNTIL_RUNTIME_PASS
          EOF
          git add -A
          git commit -m 'Fix ND loading and requested-view ready state'
          git push origin HEAD:cp3.75/nd-recovery
