name: AERIS27 R007 Anchor Probe

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r007-managed-heap-attribution
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  anchors:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct HF3 generated parent
        run: |
          set -euo pipefail
          for s in apply_aeris25_gpu_dynamic_terrain_colour_ready.py apply_aeris25_chunk_cull_guard_hotfix.py apply_aeris25_temporal_foundation_overscan_hotfix.py apply_aeris25_foundation_cull_bypass_hotfix.py apply_aeris25_renderable_entry_gate_hotfix.py apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py apply_aeris25_content_generation_burst_governor_hotfix.py apply_aeris25_persistent_presentation_batching.py apply_aeris25_main_thread_commit_governor.py apply_aeris25_staged_main_thread_commit_hotfix.py fix_aeris25_phase6_002_inherited_selftests.py apply_aeris25_authoritative_publication_lifetime_hotfix.py fix_aeris25_phase6_002_inherited_selftests.py fix_aeris25_phase6_003_inherited_selftests.py apply_aeris26_rev003_observer.py apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py; do PYTHONDONTWRITEBYTECODE=1 python3 "Tools/$s" >/dev/null; done
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py >/dev/null
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py >/dev/null
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py >/dev/null
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py >/dev/null

      - name: Publish anchor counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, urllib.request
          R=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          T=Path('Source/AERISFlightControl/Terrain/AERISTerrainTileSystem.cs').read_text()
          O=Path('Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs').read_text()
          B=Path('build_ubuntu.sh').read_text()
          checks = {
            'RFIELD': (R, '        int operationHealthRev35R006GpuAttrCapacityMax;\n'),
            'RHELP': (R, '        GeographicUnitPoint[] AcquireRev35R006GeographicBuffer(int length)\n'),
            'RDRAIN': (R, '                operationHealthContentTicks++;\n                if (workerResultReady) operationHealthContentWorkerDrains++;\n                DrainCompleted(system);\n'),
            'RCAP': (R, '                operationHealthContentCaptures++;\n                if (visible == null || visible.Tiles == null ||\n'),
            'RFOUND': (R, '                ObserveRev35R006FoundationCriticalPath(visible, tiles,\n                    currentEntriesScratch, fallbackEntriesScratch, styleKey,\n                    readyGlobal, readyFar);\n'),
            'RPRUNE': (R, '            if (contentTickRequired)\n            {\n                Prune(ResolveVramLimitBytes());\n                PruneRenderReady(ResolveRenderReadyLimitBytes());\n            }\n'),
            'RTELEM': (R, '                "; oh_rev35_r006_gpu_attr_capacity_max=" + operationHealthRev35R006GpuAttrCapacityMax +\n'),
            'TFIELD': (T, '        readonly AERISTerrainTileCacheTelemetry telemetry = new AERISTerrainTileCacheTelemetry();\n'),
            'THELP': (T, '        void InvalidatePreloadStatusUiSnapshot()\n'),
            'TPBEGIN': (T, '            if (now < nextPreloadPointRefreshRealtime) return;\n            nextPreloadPointRefreshRealtime = now + 2f;\n            var values = new List<AERISTerrainPreloadPoint>(256);\n'),
            'TPEND': (T, '            if (preloadBuilder != null) preloadBuilder.UpdatePoints(values);\n        }\n\n        void PlanRequests(Vessel vessel, AERISLandingFoundation landing)\n'),
            'TPLAN': (T, '            if (now >= nextPlanRealtime)\n            {\n                nextPlanRealtime = now + ResolvePlanningIntervalSeconds(performance);\n                PlanRequests(vessel, landing);\n            }\n            SchedulePreloadReads();\n            ScheduleResidentPopulationRead();\n            StartNextRequestIfNeeded();\n'),
            'TIO': (T, '            RecoverAbandonedIo(now);\n            RetryPendingDiskWrites(now);\n            if (now >= nextPlanRealtime)\n'),
            'TTELEM': (T, '                        "; hf3_worst_q=" +\n                        operationHealthRev35R006Hf3WorstIncompleteQuality + ".");\n'),
            'OID': (O, '        internal const string Candidate = "AERIS23_OH_PENICILLIN";\n'),
            'OFIELD': (O, '        int lastGcFrame = -1000000;\n'),
            'OINIT': (O, '            lastGc2 = GC.CollectionCount(2);\n\n            if (logLevel != AERISOperationHealthLogLevel.Off)\n'),
            'OGC': (O, '            if (d0 + d1 + d2 > 0)\n                lastGcFrame = Time.frameCount;\n\n            gc0Window += d0;\n'),
            'BID': (B, 'REV3_5_R006_HOTFIX3="AERIS27_REV3_5_SALBUTAMOL_SULFATE_R006_COMPLETE_COVERAGE_CONTRACT_HOTFIX3"\n'),
            'BVER': (B, 'PYTHONDONTWRITEBYTECODE=1 python3 "$ROOT/Tools/verify_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py"\n'),
            'BCAND': (B, 'printf \'rev3_5_r006_hotfix3=%s\\n\' "$REV3_5_R006_HOTFIX3" >> "$ROOT/GameData/AERISFlightControl/AERISCandidateBuildIdentity.txt"\n'),
          }
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']
          for name,(text,needle) in checks.items():
              count=text.count(needle); state='success' if count==1 else 'failure'
              data=json.dumps({'state':state,'context':'AERIS27/R007-ANCHOR-'+name,
                  'description':'anchor count='+str(count)}).encode()
              req=urllib.request.Request('https://api.github.com/repos/%s/statuses/%s'%(repo,sha),data=data,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AERIS27-R007-Anchor','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30): pass
          PY
