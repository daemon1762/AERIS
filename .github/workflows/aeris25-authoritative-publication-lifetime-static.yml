name: AERIS25 Authoritative Publication Lifetime Static

on:
  push:
    branches:
      - agent/aeris25-main-thread-commit-governor
  pull_request:
    branches:
      - agent/aeris25-persistent-presentation-batching

jobs:
  authoritative-publication-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NOREPINEPHRINE rev003 script syntax
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py \
            Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py \
            Tools/fix_aeris25_phase6_003_inherited_selftests.py \
            Tools/prepare_aeris25_main_thread_commit_governor_rev003_runtime.py \
            Tools/prepare_aeris25_main_thread_commit_governor_runtime.py

      - name: Reconstruct accepted lineage through Phase6_002
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_003_authoritative_publication_static.log
          echo '=== ATROPINE LINEAGE ===' | tee "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== ADENOSINE PHASE5 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE PHASE6_001 HISTORICAL PARENT ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE PHASE6_002 HISTORICAL PARENT ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Apply and verify NOREPINEPHRINE Phase6_003
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_003_authoritative_publication_static.log
          echo '=== NOREPINEPHRINE PHASE6_003 AUTHORITATIVE PUBLICATION ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_003_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Verify inherited contracts on rev003 tree
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_003_authoritative_publication_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

      - name: Rev003 idempotent re-entry
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_003_authoritative_publication_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_003_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

      - name: Generated C# publication/lifetime sanity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs')
          s=p.read_text()
          depth=0; state='code'; i=0; minimum=0
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1 < len(s) else ''
              if state=='code':
                  if c=='/' and n=='/': state='line'; i+=2; continue
                  if c=='/' and n=='*': state='block'; i+=2; continue
                  if c=='"': state='string'; i+=1; continue
                  if c=="'": state='char'; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}': depth-=1; minimum=min(minimum,depth)
                  i+=1; continue
              if state=='line':
                  if c=='\n': state='code'
                  i+=1; continue
              if state=='block':
                  if c=='*' and n=='/': state='code'; i+=2; continue
                  i+=1; continue
              if state=='string':
                  if c=='\\': i+=2; continue
                  if c=='"': state='code'
                  i+=1; continue
              if state=='char':
                  if c=='\\': i+=2; continue
                  if c=="'": state='code'
                  i+=1
          assert depth == 0 and minimum == 0, (depth,minimum)
          assert '<<<<<<<' not in s and '>>>>>>>' not in s
          assert 'AERIS25_PHASE6_003_AUTHORITATIVE_PUBLICATION' in s
          assert 'PumpStagedCompletedCommit(system, false);' in s
          assert 'PumpStagedCompletedCommit(system, true);' in s
          assert 'DetachEntryForDeferredRetirement(old);' in s
          assert 'ReleaseDeferredEntryRetirements(false);' in s
          assert 'ElapsedMilliseconds(mainThreadCommitStopwatch)' not in s
          print('[PHASE6_003 CSHARP PUBLICATION/LIFETIME STRUCTURE] PASS')
          PY
          grep -Fq "r'\1NOREPINEPHRINE'" build_ubuntu.sh
          if grep -Fq "r'\1ATROPINE'" build_ubuntu.sh; then
            echo 'legacy ATROPINE install promotion remains active' >&2
            exit 1
          fi
          git diff --check

      - name: Assert final rev003 markers
        run: |
          grep -Fq '[AERIS25 NOREPINEPHRINE PHASE6_003 AUTHORITATIVE PUBLICATION] STATIC PASS' aeris25_phase6_003_authoritative_publication_static.log
          grep -Fq 'authoritative publication renderer patch already present' aeris25_phase6_003_authoritative_publication_static.log
          grep -Fq '[Operation Health Pass 3 PREBUILD] 20/20 suites PASS' aeris25_phase6_003_authoritative_publication_static.log

      - name: Upload rev003 static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-phase6-003-authoritative-publication-lifetime-static
          path: |
            aeris25_phase6_003_authoritative_publication_static.log
            Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
            Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
            GameData/AERISFlightControl/Config/AERISOperationHealth.cfg
            Tools/verify_aeris25_persistent_presentation_batching.py
            Tools/selftest_v01800_operation_health_step2_motion_content_coastal_refinement.py
            Tools/selftest_v01800_operation_health_retained_surface.py
            build_ubuntu.sh
          if-no-files-found: error
