name: AERIS25 DIAZEPAM Install Identity Hotfix Static

on:
  push:
    branches:
      - agent/aeris25-diazepam-resident-ram-reuse-rev006
  pull_request:
    branches:
      - agent/aeris25-main-thread-commit-governor
  workflow_dispatch:

jobs:
  install-identity-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Entrypoint syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "text.encode('utf-8')" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "text.encode('utf-16le')" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "DIAZEPAM RESIDENT RAM REUSE STRENGTHENING REV006" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "legacy_display_gate" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "fixed_display_gate" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "Source/AERISFlightControl/bin" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "Source/AERISFlightControl/obj" Tools/prepare_aeris25_diazepam_runtime.py
          grep -Fq "shutil.rmtree" Tools/prepare_aeris25_diazepam_runtime.py

      - name: UTF16 .NET marker compatibility model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          markers = (
              'OH_PHASE7_001',
              'DIAZEPAM RESIDENT RAM REUSE STRENGTHENING REV006',
              'oh_resident_prep_hit=',
              'oh_resident_prep_bytes=',
          )
          p = Path('diazepam_utf16_marker_fixture.bin')
          p.write_bytes(b'prefix' + ''.join(markers).encode('utf-16le') + b'suffix')
          data = p.read_bytes()
          for text in markers:
              assert text.encode('utf-8') in data or text.encode('utf-16le') in data, text
          assert b'OH_PHASE7_001' not in data
          print('[DIAZEPAM INSTALL IDENTITY HOTFIX] UTF8/UTF16 official marker model PASS')
          p.unlink()
          PY

      - name: REV006 display gate order correction model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/prepare_aeris25_diazepam_rev006_runtime.py')
          s=p.read_text()
          legacy="'REV006 RESIDENT RAM REUSE STRENGTHENING' in dll_strings"
          fixed="'DIAZEPAM RESIDENT RAM REUSE STRENGTHENING REV006' in dll_strings"
          assert s.count(legacy)==1
          assert fixed not in s
          patched=s.replace(legacy,fixed,1)
          assert legacy not in patched
          assert patched.count(fixed)==1
          print('[DIAZEPAM INSTALL IDENTITY HOTFIX 2] REV006 display gate order correction PASS')
          PY

      - name: No generated bytecode residue
        shell: bash
        run: |
          rm -rf Tools/__pycache__
          test -z "$(git status --porcelain)"
