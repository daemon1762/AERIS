name: Candidate9 one-shot CSharp syntax validation

on:
  push:
    branches: [cp3.75/nd-recovery]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Install syntax parser
        run: python3 -m pip install --quiet tree-sitter tree-sitter-c-sharp
      - name: Parse modified CSharp and run prebuild
        shell: python
        run: |
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          lang=Language(tree_sitter_c_sharp.language())
          parser=Parser(lang)
          paths=[
            Path('Source/AERISFlightControl/Terrain/AERISTerrainCoastlinePolicy.cs'),
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs'),
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'),
          ]
          bad=[]
          for p in paths:
            data=p.read_bytes()
            tree=parser.parse(data)
            stack=[tree.root_node]
            errors=[]
            while stack:
              n=stack.pop()
              if n.type=='ERROR' or n.is_missing:
                errors.append((n.type,n.start_point,n.end_point))
              stack.extend(n.children)
            if errors:
              bad.append((str(p),errors[:10]))
              print('[FAIL]',p,errors[:10])
            else:
              print('[PASS]',p,'C# syntax tree clean')
          if bad: raise SystemExit('C# syntax parse failed')
          Path('.github/workflows/candidate9-syntax-one-shot.yml').unlink()
      - name: Run Candidate9 prebuild static suites
        run: python3 Tools/run_v01800_cp375_candidate9_prebuild.py
      - name: Commit validation evidence and self-delete
        run: |
          printf '%s\n' 'CP3.75 Candidate9 GitHub validation:' 'tree-sitter C# syntax: PASS' 'Candidate9 prebuild static suites: PASS' > Evidence/CP3.75_CANDIDATE9_GITHUB_STATIC_VALIDATION.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate CP3.75 Candidate9 source structure"
          git push origin HEAD:cp3.75/nd-recovery
