name: AERIS25 Staged Main Thread Commit Static

on:
  push:
    branches:
      - agent/aeris25-main-thread-commit-governor
  pull_request:
    branches:
      - agent/aeris25-persistent-presentation-batching

jobs:
  staged-main-thread-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NOREPINEPHRINE rev002 script syntax
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_staged_main_thread_commit_hotfix.py \
            Tools/verify_aeris25_staged_main_thread_commit_hotfix.py \
            Tools/prepare_aeris25_main_thread_commit_governor_runtime.py
          test -s Tools/aeris25_phase6_002_staged_commit.patch.part00
          test -s Tools/aeris25_phase6_002_staged_commit.patch.part01
          test -s Tools/aeris25_phase6_002_staged_commit.patch.part02
          test -s Tools/aeris25_phase6_002_staged_commit.patch.part03

      - name: Reconstruct accepted AERIS25 lineage through Phase6_001
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_002_staged_commit_static.log
          echo '=== ATROPINE LINEAGE ===' | tee "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== ADENOSINE PHASE5 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE PHASE6_001 HISTORICAL PARENT ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"

      - name: Apply and verify NOREPINEPHRINE Phase6_002
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_002_staged_commit_static.log
          echo '=== NOREPINEPHRINE PHASE6_002 STAGED COMMIT ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Verify inherited contracts on rev002 tree
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_002_staged_commit_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

      - name: Rev002 idempotent re-entry
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_002_staged_commit_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"

      - name: Generated C# structural sanity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs')
          s=p.read_text()
          depth=0; state='code'; i=0; minimum=0
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1 < len(s) else ''
              if state=='code':
                  if c=='/' and n=='/': state='line'; i+=2; continue
                  if c=='/' and n=='*': state='block'; i+=2; continue
                  if c=='"': state='string'; i+=1; continue
                  if c=="'": state='char'; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}': depth-=1; minimum=min(minimum, depth)
                  i+=1; continue
              if state=='line':
                  if c=='\n': state='code'
                  i+=1; continue
              if state=='block':
                  if c=='*' and n=='/': state='code'; i+=2; continue
                  i+=1; continue
              if state=='string':
                  if c=='\\': i+=2; continue
                  if c=='"': state='code'
                  i+=1; continue
              if state=='char':
                  if c=='\\': i+=2; continue
                  if c=="'": state='code'
                  i+=1
          assert depth == 0 and minimum == 0, (depth, minimum)
          assert '<<<<<<<' not in s and '>>>>>>>' not in s
          assert 'AERIS25_STAGED_MAIN_THREAD_COMMIT' in s
          assert 'ElapsedMilliseconds(mainThreadCommitStopwatch)' not in s
          print('[PHASE6_002 CSHARP STRUCTURE] PASS')
          PY
          git diff --check

      - name: Assert final rev002 markers
        run: |
          grep -Fq '[AERIS25 NOREPINEPHRINE PHASE6_002 STAGED MAIN THREAD COMMIT] STATIC PASS' aeris25_phase6_002_staged_commit_static.log
          grep -Fq 'staged renderer patch already present' aeris25_phase6_002_staged_commit_static.log
          grep -Fq '[Operation Health Pass 3 PREBUILD] 20/20 suites PASS' aeris25_phase6_002_staged_commit_static.log

      - name: Upload rev002 static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-phase6-002-staged-main-thread-commit-static
          path: |
            aeris25_phase6_002_staged_commit_static.log
            Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
            Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
            GameData/AERISFlightControl/Config/AERISOperationHealth.cfg
            Tools/verify_aeris25_persistent_presentation_batching.py
            build_ubuntu.sh
          if-no-files-found: error
