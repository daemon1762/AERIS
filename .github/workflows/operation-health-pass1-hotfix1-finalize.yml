name: Operation Health Pass 1 Hotfix 1 Finalize
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Finalize Hotfix 1 identity
        run: python3 Tools/_operation_health_pass1_hotfix1_finalize.py
      - name: Commit identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build_ubuntu.sh Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs
          git diff --cached --quiet || git commit -m "Finalize Operation Health Pass 1 Hotfix 1 identity"
          git push origin HEAD:cp3.75/nd-recovery
