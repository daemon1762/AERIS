name: Operation Health Pass 2 Persistent Geometry
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply Operation Health Pass 2
        run: python3 Tools/_operation_health_pass2_persistent_geometry_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
          git diff --cached --quiet || git commit -m "Implement Operation Health Pass 2 persistent geometry"
          git push origin HEAD:cp3.75/nd-recovery
