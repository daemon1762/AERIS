name: AERIS23 Fixed Aspect Final Geometry
on:
  pull_request:
    branches: [ "cp3.75/nd-recovery" ]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aeris23-fixed-aspect-rollback
          fetch-depth: 0
      - name: Keep ND inner map geometry proportional
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Source/AERISFlightControl/UI/AERISNavigationDisplay.cs')
          t=p.read_text()
          old='''            float scale = Mathf.Clamp(Mathf.Min(rect.width / 380f, rect.height / 244f), 0.30f, 1.25f);'''
          new='''            // ND panel resizing is fixed-aspect. Keep every internal furniture dimension\n            // on that same scale as well; the old 1.25 ceiling made larger panels drift\n            // away from the accepted 366:188 map-plot geometry even when the outer panel\n            // itself remained 380:244. Screen bounds in AERISFlightInstrument own the\n            // upper size limit.\n            float scale = Mathf.Max(0.80f,\n                Mathf.Min(rect.width / 380f, rect.height / 244f));'''
          if t.count(old)!=1: raise SystemExit('ND scale anchor count='+str(t.count(old)))
          p.write_text(t.replace(old,new,1))

          p=Path('Source/AERISFlightControl/UI/AERISFlightInstrument.cs')
          t=p.read_text()
          old='''            float minimumScale = Mathf.Max(\n                MinimumPanelWidth / BasePanelWidth,\n                MinimumPanelHeight / BasePanelHeight);'''
          new='''            // Below 0.80 the ND's readability floors (header/control/margin) stop\n            // shrinking proportionally and would alter the internal map-plot aspect.\n            // 0.80 is therefore the fixed-geometry minimum for ND only.\n            float minimumScale = Mathf.Max(0.80f, Mathf.Max(\n                MinimumPanelWidth / BasePanelWidth,\n                MinimumPanelHeight / BasePanelHeight));'''
          if t.count(old)!=1: raise SystemExit('minimum scale anchor count='+str(t.count(old)))
          p.write_text(t.replace(old,new,1))

          p=Path('Tools/selftest_v01800_nd_fixed_aspect_resize.py')
          t=p.read_text()
          anchor="ck('rect.width = BasePanelWidth * scale;' in U and\n   'rect.height = BasePanelHeight * scale;' in U,\n   'every ND resize writes both dimensions from one scale')\n"
          extra=anchor+"N=(ROOT/'Source/AERISFlightControl/UI/AERISNavigationDisplay.cs').read_text()\nck('Mathf.Max(0.80f,' in N and '1.25f' not in N[N.index('internal void Draw(Rect rect)'):N.index('void EnsureStyles')],\n   'ND internal layout follows panel scale above 1.25 without geometry drift')\nck('float minimumScale = Mathf.Max(0.80f' in U,\n   'ND minimum size stays above internal readability-floor distortion threshold')\n"
          if t.count(anchor)!=1: raise SystemExit('selftest anchor count='+str(t.count(anchor)))
          p.write_text(t.replace(anchor,extra,1))
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          git diff --check
          grep -q 'float scale = Mathf.Max(0.80f' Source/AERISFlightControl/UI/AERISNavigationDisplay.cs
          grep -q 'float minimumScale = Mathf.Max(0.80f' Source/AERISFlightControl/UI/AERISFlightInstrument.cs
          ! sed -n '/internal void Draw(Rect rect)/,/void EnsureStyles/p' Source/AERISFlightControl/UI/AERISNavigationDisplay.cs | grep -q '1.25f'

          git config user.name 'AERIS Patch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Source/AERISFlightControl/UI/AERISNavigationDisplay.cs Source/AERISFlightControl/UI/AERISFlightInstrument.cs Tools/selftest_v01800_nd_fixed_aspect_resize.py
          git commit -m 'Keep fixed-aspect ND inner geometry proportional'
          git rm .github/workflows/aeris23-fixed-aspect-final-geometry.yml
          git commit -m 'Remove temporary final geometry validator'
          git push origin HEAD:agent/aeris23-fixed-aspect-rollback
