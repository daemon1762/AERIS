name: AERIS23 PR Branch Validator Bootstrap
on:
  pull_request:
    branches:
      - cp3.75/nd-recovery
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  run-branch-validator:
    if: github.head_ref == 'agent/aeris23-projection-motion-bridge'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aeris23-projection-motion-bridge
          fetch-depth: 0
      - name: Execute validator stored on PR branch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/aeris23-projection-motion-bridge.yml ]; then
            echo 'branch validator already consumed; no-op'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aeris23-projection-motion-bridge.yml').read_text()
          marker='        run: |\n'
          pos=src.index(marker)+len(marker)
          block=src[pos:]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/aeris_branch_validator.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/aeris_branch_validator.sh
