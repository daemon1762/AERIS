name: AERIS26 REV003 Observer Platform Hotfix Static

on:
  push:
    branches:
      - agent/aeris26-rev003-observer
  pull_request:
    branches:
      - agent/aeris25-diazepam-resident-ram-reuse-rev006
  workflow_dispatch:

jobs:
  platform-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wrapper syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "KSP_x64_Data/Managed/Assembly-CSharp.dll" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "KSP_x86_64_Data/Managed/Assembly-CSharp.dll" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "KSP_Data/Managed/Assembly-CSharp.dll" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "authoritative layout=windows/proton" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "seeded accepted" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "accepted shader pair unavailable; invoking local AERIS25 shader build" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "Tools/build_aeris25_gpu_shader_bundle.sh" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "shader build acceptance=PASS" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "Unity Editor 2019.4.18f1" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "installed_shader_dir" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "shutil.copy2" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "6465e6dfa7c9809a734d5ce85b202b49ea6ee5fcaac19d55d4b75bd532a35f0d" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          grep -Fq "runpy.run_path" Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py
          bash -n Tools/build_aeris25_gpu_shader_bundle.sh

      - name: Platform authority model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tempfile

          # Windows/Proton layout wins when KSP_x64_Data is the Managed authority,
          # even if unrelated Linux executables coexist.
          with tempfile.TemporaryDirectory() as td:
              ksp = Path(td)
              (ksp / 'KSP.x86_64').write_text('co-resident')
              (ksp / 'KSP_x64.exe').write_text('windows')
              managed = ksp / 'KSP_x64_Data/Managed'
              managed.mkdir(parents=True)
              (managed / 'Assembly-CSharp.dll').write_text('managed')
              windows_layout = (ksp / 'KSP_x64_Data/Managed/Assembly-CSharp.dll').is_file()
              linux_layout = ((ksp / 'KSP_x86_64_Data/Managed/Assembly-CSharp.dll').is_file() or
                              (ksp / 'KSP_Data/Managed/Assembly-CSharp.dll').is_file())
              shader_mode = 'windows' if windows_layout else ('linux' if linux_layout else 'unknown')
              assert shader_mode == 'windows'

          # Native Linux layout remains Linux even if a stale Windows exe exists.
          with tempfile.TemporaryDirectory() as td:
              ksp = Path(td)
              (ksp / 'KSP_x64.exe').write_text('stale')
              managed = ksp / 'KSP_Data/Managed'
              managed.mkdir(parents=True)
              (managed / 'Assembly-CSharp.dll').write_text('managed')
              windows_layout = (ksp / 'KSP_x64_Data/Managed/Assembly-CSharp.dll').is_file()
              linux_layout = ((ksp / 'KSP_x86_64_Data/Managed/Assembly-CSharp.dll').is_file() or
                              (ksp / 'KSP_Data/Managed/Assembly-CSharp.dll').is_file())
              shader_mode = 'windows' if windows_layout else ('linux' if linux_layout else 'unknown')
              assert shader_mode == 'linux'

          print('[REV003 OBSERVER PLATFORM HOTFIX] platform authority model PASS')
          PY

      - name: Local shader build fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Tools/prepare_aeris26_rev003_observer_runtime_hotfix.py').read_text()
          source = text.index('if accepted_pair_ok(source_bundle, source_probe):')
          installed = text.index('elif accepted_pair_ok(installed_bundle, installed_probe):')
          local = text.index("run(['bash', ROOT / 'Tools/build_aeris25_gpu_shader_bundle.sh', shader_mode]")
          verify = text.index("if not accepted_pair_ok(source_bundle, source_probe):", local)
          delegate = text.index("runpy.run_path(str(TARGET), run_name='__main__')")
          assert source < installed < local < verify < delegate
          assert 'EXPECTED_WINDOWS_PROBE_SHA' in text
          assert 'local shader build failed' in text
          print('[REV003 OBSERVER PLATFORM HOTFIX] source -> installed -> local-build fallback ordering PASS')
          PY

      - name: No bytecode residue
        shell: bash
        run: |
          rm -rf Tools/__pycache__
          test -z "$(git status --porcelain)"
