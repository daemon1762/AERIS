name: AERIS27 R007 Managed Heap Attribution V2 Gate

on:
  push:
    branches:
      - agent/aeris27-rev3-5-salbutamol-r007-managed-heap-attribution
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  r007-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/apply_aeris27_rev3_5_salbutamol_r007_managed_heap_attribution.py Tools/apply_aeris27_rev3_5_salbutamol_r007_managed_heap_attribution_v2.py Tools/verify_aeris27_rev3_5_salbutamol_r007_managed_heap_attribution.py Tools/prepare_aeris27_rev3_5_salbutamol_r007_v2_runtime.py
          rm -rf Tools/__pycache__
      - name: Reconstruct accepted lineage through R005
        run: |
          set -euo pipefail
          for s in apply_aeris25_gpu_dynamic_terrain_colour_ready.py apply_aeris25_chunk_cull_guard_hotfix.py apply_aeris25_temporal_foundation_overscan_hotfix.py apply_aeris25_foundation_cull_bypass_hotfix.py apply_aeris25_renderable_entry_gate_hotfix.py apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py apply_aeris25_content_generation_burst_governor_hotfix.py apply_aeris25_persistent_presentation_batching.py apply_aeris25_main_thread_commit_governor.py apply_aeris25_staged_main_thread_commit_hotfix.py fix_aeris25_phase6_002_inherited_selftests.py apply_aeris25_authoritative_publication_lifetime_hotfix.py fix_aeris25_phase6_002_inherited_selftests.py fix_aeris25_phase6_003_inherited_selftests.py apply_aeris26_rev003_observer.py apply_aeris27_rev3_5_salbutamol_r001_compile_hotfix1.py apply_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py apply_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py apply_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py apply_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py; do PYTHONDONTWRITEBYTECODE=1 python3 "Tools/$s" >/dev/null; done
      - name: Apply R006 HF1 HF2 HF3 and R007 V2
        run: |
          set -euo pipefail
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          python3 Tools/apply_aeris27_rev3_5_salbutamol_r007_managed_heap_attribution_v2.py
      - name: Verify inherited contracts and R007
        run: |
          set -euo pipefail
          python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_resumable_prepare.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r002_packed_allocation_split.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r003_requested_view_admission.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r004_adaptive_high_flow_commit.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r005_split_weight_flow_lanes.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_managed_buffer_reuse_foundation_observer.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_hotfix1.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_resource_release_order_hotfix2.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r006_complete_coverage_contract_hotfix3.py
          python3 Tools/verify_aeris27_rev3_5_salbutamol_r007_managed_heap_attribution.py
          git diff --check
      - name: Measurement-only guard
        run: |
          set -euo pipefail
          R=Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
          T=Source/AERISFlightControl/Terrain/AERISTerrainTileSystem.cs
          O=Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
          grep -Fq 'AERIS27_REV3_5_SALBUTAMOL_SULFATE_R007_MANAGED_HEAP_ATTRIBUTION' "$R"
          grep -Fq '[R007_GC]' "$O"
          ! grep -Fq 'GC.Collect(' "$R"
          ! grep -Fq 'GC.Collect(' "$T"
          ! grep -Fq 'GC.Collect(' "$O"
          ! grep -Fq 'WaitManagedPreparation' "$R"
          ! grep -Fq 'ResidentPreparedPresentation' "$R"
          grep -Fq 'presentationNow + 0.10f' "$R"
          grep -Fq 'RenderTextureFormat.ARGB32' "$R"
          grep -Fq 'FilterMode.Bilinear' "$R"
      - name: No tool residue
        run: |
          set -euo pipefail
          rm -rf Tools/__pycache__
          test -z "$(git status --porcelain | grep '__pycache__' || true)"
      - name: Publish authoritative R007 V2 status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; if [ "$PRIOR_JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='AERIS27/R007-MANAGED-HEAP-ATTRIBUTION-V2-GATE' -f description="R007 V2 $state" >/dev/null
