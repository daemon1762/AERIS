name: Operation Health Pass 3 Cadence Hotfix 1
on:
  pull_request:
    branches: [cp3.75/nd-recovery]
    types: [opened]
permissions:
  contents: write
  pull-requests: read
jobs:
  hotfix:
    if: github.head_ref == 'automation/operation-health-pass3-cadence-hotfix1-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Apply cadence hard cap and validate
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          renderer=root/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'
          r=renderer.read_text()

          old='''        long operationHealthBoundsSkips;\n        long operationHealthTerrainSetPassSaved;\n        long operationHealthMeshPoolHits;'''
          new='''        long operationHealthBoundsSkips;\n        long operationHealthTerrainSetPassSaved;\n        // Cadence Hotfix 1: content/view revisions may request a refresh, but they may\n        // not bypass the fixed 10 Hz presentation gate. Bootstrap remains the only\n        // normal-path immediate exception when no FRONT has ever been attempted.\n        long operationHealthCadenceDeferrals;\n        long operationHealthCadenceBootstrapBypasses;\n        long operationHealthMeshPoolHits;'''
          if new not in r:
              if old not in r: raise SystemExit('renderer telemetry anchor missing')
              r=r.replace(old,new,1)

          old_method='''        bool ShouldRefreshBackBuffer(AERISTerrainVisibleTileSet visible,\n            bool refreshRequired)\n        {\n            if (!refreshRequired || visible == null) return false;\n            if (!frontBufferValid && lastBackAttemptViewGeneration < 0L) return true;\n            if (lastBackAttemptViewGeneration != visible.ViewGeneration) return true;\n            if (lastBackAttemptContentRevision != gpuContentRevision) return true;\n            return Time.realtimeSinceStartup >= nextBackRefreshRealtime;\n        }'''
          new_method='''        bool ShouldRefreshBackBuffer(AERISTerrainVisibleTileSet visible,\n            bool refreshRequired)\n        {\n            if (!refreshRequired || visible == null) return false;\n            // First ever FRONT construction must not wait on a stale/default timer.\n            // After that, every ordinary BACK render request shares one absolute\n            // 0.10 s gate, including ViewGeneration and gpuContentRevision changes.\n            if (!frontBufferValid && lastBackAttemptViewGeneration < 0L)\n            {\n                operationHealthCadenceBootstrapBypasses++;\n                return true;\n            }\n            if (Time.realtimeSinceStartup < nextBackRefreshRealtime)\n            {\n                operationHealthCadenceDeferrals++;\n                return false;\n            }\n            return true;\n        }'''
          if new_method not in r:
              if old_method not in r: raise SystemExit('ShouldRefreshBackBuffer anchor missing')
              r=r.replace(old_method,new_method,1)

          old_log='''                "; oh_bounds_skip=" + operationHealthBoundsSkips +\n                "; oh_setpass_saved=" + operationHealthTerrainSetPassSaved +\n                "; cpu_terrain_draw=0.");'''
          new_log='''                "; oh_bounds_skip=" + operationHealthBoundsSkips +\n                "; oh_setpass_saved=" + operationHealthTerrainSetPassSaved +\n                "; oh_cadence_defer=" + operationHealthCadenceDeferrals +\n                "; oh_cadence_bootstrap=" + operationHealthCadenceBootstrapBypasses +\n                "; cpu_terrain_draw=0.");'''
          if new_log not in r:
              if old_log not in r: raise SystemExit('renderer telemetry log anchor missing')
              r=r.replace(old_log,new_log,1)
          renderer.write_text(r)

          test=root/'Tools/selftest_v01800_operation_health_pass3_cadence_hotfix1.py'
          test.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport json,sys\nsys.dont_write_bytecode=True\nROOT=Path(__file__).resolve().parents[1]\nR=(ROOT/'Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()\nS=(ROOT/'Source/AERISFlightControl/Settings/AERISSettings.cs').read_text()\nB=(ROOT/'build_ubuntu.sh').read_text()\nV=json.loads((ROOT/'GameData/AERISFlightControl/AERISFlightControl.version').read_text())\nchecks=[]\ndef ck(v,n):\n checks.append((bool(v),n)); print(('[PASS] ' if v else '[FAIL] ')+n)\nstart=R.index('bool ShouldRefreshBackBuffer(')\nend=R.index('bool NeedsProjectionRefresh(',start)\nm=R[start:end]\nck('internal const float FixedNavigationDisplayUpdateHz = 10f' in S, 'ND presentation contract remains fixed at 10 Hz')\nck('Time.realtimeSinceStartup < nextBackRefreshRealtime' in m, 'ordinary BACK refresh has an absolute cadence gate')\nck('lastBackAttemptViewGeneration != visible.ViewGeneration) return true' not in m, 'view generation cannot bypass cadence gate')\nck('lastBackAttemptContentRevision != gpuContentRevision) return true' not in m, 'content revision cannot bypass cadence gate')\nck('operationHealthCadenceDeferrals++' in m, 'cadence deferrals are observable')\nck('!frontBufferValid && lastBackAttemptViewGeneration < 0L' in m and 'operationHealthCadenceBootstrapBypasses++' in m, 'first FRONT bootstrap remains immediate and observable')\nck(R.count('nextBackRefreshRealtime = Time.realtimeSinceStartup + 0.10f') >= 2, 'normal and forced recovery renders preserve 0.10 second scheduling authority')\nck('forcedRecoveryBackRenders++' in R, 'blank-recovery exception remains separate and observable')\nck('oh_cadence_defer=' in R and 'oh_cadence_bootstrap=' in R, 'runtime cadence telemetry is published')\nck('RenderTextureFormat.ARGB32' in R and 'FilterMode.Bilinear' in R, 'render-target visual quality authority unchanged')\nck(V.get('NAME') == 'AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 1', 'runtime package identity is Cadence Hotfix 1')\nck('OPERATION HEALTH PASS 3 CADENCE HOTFIX 1' in B, 'Ubuntu build entrypoint identifies Cadence Hotfix 1')\nfailed=[n for ok,n in checks if not ok]\nprint('\\n[Operation Health Pass 3 Cadence Hotfix 1] %d/%d PASS' % (len(checks)-len(failed),len(checks)))\nif failed:\n print('FAILED: '+', '.join(failed)); raise SystemExit(1)\n''')

          runner=root/'Tools/run_v01800_operation_health_pass3_prebuild.py'
          q=runner.read_text()
          anchor="suites=[\n ('Operation Health Pass 3 projection/draw reduction','selftest_v01800_operation_health_pass3_projection_draw_reduction.py'),"
          replacement="suites=[\n ('Operation Health Pass 3 Cadence Hotfix 1','selftest_v01800_operation_health_pass3_cadence_hotfix1.py'),\n ('Operation Health Pass 3 projection/draw reduction','selftest_v01800_operation_health_pass3_projection_draw_reduction.py'),"
          if replacement not in q:
              if anchor not in q: raise SystemExit('prebuild suite anchor missing')
              q=q.replace(anchor,replacement,1)
          runner.write_text(q)

          version=root/'GameData/AERISFlightControl/AERISFlightControl.version'
          v=json.loads(version.read_text())
          v['NAME']='AERISFlightControl DEV CP3.75 Operation Health Pass 3 Cadence Hotfix 1'
          version.write_text(json.dumps(v,indent=2)+'\n')

          gen=root/'Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs'
          g=gen.read_text()
          g=g.replace('AERIS Flight Control v0.18.0.0 DEV CP3.75 OPERATION HEALTH PASS 3"','AERIS Flight Control v0.18.0.0 DEV CP3.75 OPERATION HEALTH PASS 3 CADENCE HOTFIX 1"')
          g=g.replace('DEV CP3.75 — OPERATION HEALTH PASS 3"','DEV CP3.75 — OPERATION HEALTH PASS 3 CADENCE HOTFIX 1"')
          gen.write_text(g)

          build=root/'build_ubuntu.sh'
          b=build.read_text()
          b=b.replace('DISPLAY="AERIS Flight Control v$SEMVER DEV CP3.75 OPERATION HEALTH PASS 3"','DISPLAY="AERIS Flight Control v$SEMVER DEV CP3.75 OPERATION HEALTH PASS 3 CADENCE HOTFIX 1"')
          b=b.replace('UiCheckpoint = "DEV CP3.75 — OPERATION HEALTH PASS 3"','UiCheckpoint = "DEV CP3.75 — OPERATION HEALTH PASS 3 CADENCE HOTFIX 1"')
          build.write_text(b)

          doc=root/'Docs/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX1_ja.md'
          doc.write_text('''# Operation Health Pass 3 Cadence Hotfix 1\n\n## 目的\nND距離切替直後に ViewGeneration / gpuContentRevision の更新が 0.10 秒ゲートを迂回し、FRONT swap が一時的に 10 Hz を超える問題を修正する。\n\n## 修正\n- ViewGeneration / ContentRevision は refreshRequired の理由としてのみ使用する。\n- 初回 FRONT 構築後の通常 BACK render は常に nextBackRefreshRealtime を通す。\n- 初回 FRONT なしの bootstrap は即時許可する。\n- blank 回避の forced recovery は既存の独立安全経路として維持する。\n- oh_cadence_defer / oh_cadence_bootstrap を追加する。\n\n## 非変更\nCandidate11 visual authority、ARGB32/Bilinear、129x129 coastline authority、96-level contour budget、Sparse Coastal Correction、FRONT-synchronized symbology、Pass 2 mesh pool、Pass 3 bounds/SetPass/index/colour optimizationsは変更しない。\n''')
          PY
          PATCH_RC=$?
          if [ "$PATCH_RC" -ne 0 ]; then
            echo "CADENCE_HOTFIX_SAFE_STOP_PATCH_FAILED rc=$PATCH_RC"
            exit 0
          fi

          python3 Tools/run_v01800_operation_health_pass3_prebuild.py
          TEST_RC=$?
          if [ "$TEST_RC" -ne 0 ]; then
            echo "CADENCE_HOTFIX_SAFE_STOP_PREBUILD_FAILED rc=$TEST_RC"
            git reset --hard HEAD
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/operation-health-pass3-cadence-hotfix1.yml
          cat > Evidence/OPERATION_HEALTH_PASS3_CADENCE_HOTFIX1_STATIC_VALIDATION.txt <<'EOF'
          Operation Health Pass 3 Cadence Hotfix 1 static validation
          cause=ViewGeneration/ContentRevision bypassed nextBackRefreshRealtime
          normal_front_cadence_hard_cap=10Hz
          bootstrap_exception=YES
          forced_recovery_exception=UNCHANGED
          prebuild=PASS
          visual_authority_changed=NO
          runtime_ksp=UNVERIFIED
          release_candidate=NO_UNTIL_RUNTIME_PASS
          EOF
          git add -A
          git commit -m 'Fix Operation Health Pass 3 ND cadence bypass'
          COMMIT_RC=$?
          if [ "$COMMIT_RC" -ne 0 ]; then
            echo "CADENCE_HOTFIX_SAFE_STOP_NO_COMMIT rc=$COMMIT_RC"
            exit 0
          fi
          git push origin HEAD:cp3.75/nd-recovery
          PUSH_RC=$?
          if [ "$PUSH_RC" -ne 0 ]; then
            echo "CADENCE_HOTFIX_PUSH_FAILED rc=$PUSH_RC"
            exit 0
          fi
          echo "CADENCE_HOTFIX_APPLIED=YES"
