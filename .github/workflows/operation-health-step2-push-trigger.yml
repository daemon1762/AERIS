name: Operation Health Step 2 Push Trigger
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Execute staged Step 2 workflow body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/operation-health-step2-motion-content-coastal-refinement.yml')
          text=source.read_text()
          marker='        run: |\n'
          if marker not in text:
              raise SystemExit('Step 2 staged workflow run block not found')
          body=text.split(marker,1)[1]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  raise SystemExit('unexpected Step 2 workflow indentation: '+line)
              else:
                  lines.append('')
          Path('/tmp/aeris_step2_staged.sh').write_text('\n'.join(lines)+'\n')
          PY
          rm -f .github/workflows/operation-health-step2-push-trigger.yml
          bash /tmp/aeris_step2_staged.sh
