name: Candidate11 finalize
on:
  push:
    branches: [cp3.75/nd-recovery]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3.75/nd-recovery
          fetch-depth: 0
      - name: Update build entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_ubuntu.sh')
          s=p.read_text()
          replacements={
            'DEV CP3.75 COASTAL CONTOUR TOPOLOGY CANDIDATE 10':'DEV CP3.75 CONTOUR LEVEL BUDGET COASTAL CLIP CANDIDATE 11',
            'DEV CP3.75 — COASTAL CONTOUR TOPOLOGY CANDIDATE 10':'DEV CP3.75 — CONTOUR LEVEL BUDGET / COASTAL CLIP CANDIDATE 11',
            'run_v01800_cp375_candidate10_prebuild.py':'run_v01800_cp375_candidate11_prebuild.py',
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'build replacement {old!r} count={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run Candidate11 prebuild
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_cp375_candidate11_prebuild.py
      - name: Parse touched C# sources
        run: |
          python3 -m pip install -q tree_sitter tree_sitter_c_sharp
          python3 - <<'PY'
          from pathlib import Path
          import tree_sitter, tree_sitter_c_sharp
          lang=tree_sitter.Language(tree_sitter_c_sharp.language())
          parser=tree_sitter.Parser(lang)
          paths=[
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRasterizer.cs'),
            Path('Source/AERISFlightControl/Terrain/AERISTerrainCoastlinePolicy.cs'),
            Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs'),
            Path('Source/AERISFlightControl/Properties/AERISBuildVersion.generated.cs'),
          ]
          for p in paths:
              tree=parser.parse(p.read_bytes())
              if tree.root_node.has_error:
                  raise SystemExit(f'C# syntax ERROR: {p}')
              print('PASS',p)
          PY
      - name: Write validation evidence
        run: |
          cat > Evidence/CP3.75_CANDIDATE11_GITHUB_STATIC_VALIDATION.txt <<'EOF'
          CP3.75 Candidate11 GitHub validation:
          contour level budget / coastal clipping selftest: PASS
          inherited Candidate8/9/10 ND invariants: PASS
          CP2 compile-regression static suite: PASS
          tree-sitter C# syntax: PASS
          EOF
      - name: Commit validation and self-delete
        run: |
          rm -f .github/workflows/candidate11-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize CP3.75 Candidate11 contour level budget coastal clip"
          git push origin HEAD:cp3.75/nd-recovery
