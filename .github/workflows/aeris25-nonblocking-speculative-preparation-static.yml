name: AERIS25 Non-Blocking Speculative Preparation Static

on:
  push:
    branches:
      - agent/aeris25-nonblocking-speculative-preparation
  pull_request:
    branches:
      - agent/aeris25-main-thread-commit-governor

jobs:
  nonblocking-speculative-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NOREPINEPHRINE rev005 script syntax and install tooling
        run: |
          python3 -m py_compile \
            Tools/apply_aeris25_nonblocking_speculative_preparation_hotfix.py \
            Tools/fix_aeris25_phase6_005_inherited_selftests.py \
            Tools/verify_aeris25_nonblocking_speculative_preparation_hotfix.py \
            Tools/verify_aeris25_rev005_install_identity_hotfix.py \
            Tools/prepare_aeris25_main_thread_commit_governor_rev005_runtime.py \
            Tools/prepare_aeris25_main_thread_commit_governor_runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_rev005_install_identity_hotfix.py

      - name: Reconstruct accepted lineage through Phase6_003
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          echo '=== ATROPINE REV009 ===' | tee "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_dynamic_terrain_colour_ready.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_chunk_cull_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_temporal_foundation_overscan_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_foundation_cull_bypass_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_renderable_entry_gate_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_gpu_vertex_reject_diagnostics_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_snapshot_mesh_lifetime_guard_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_content_generation_burst_governor_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== ADENOSINE ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE REV001 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_main_thread_commit_governor.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE REV002 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_002_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_staged_main_thread_commit_hotfix.py 2>&1 | tee -a "$LOG"
          echo '=== NOREPINEPHRINE REV003 ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_003_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_authoritative_publication_lifetime_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Reconstruct exact failed REV004 parent
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          echo '=== NOREPINEPHRINE REV004 MANAGED PREPARATION — RUNTIME-FAILED PARENT ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_managed_preparation_pipeline_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_004_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_managed_preparation_pipeline_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Apply and verify NOREPINEPHRINE Phase6_005
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          echo '=== NOREPINEPHRINE REV005 NON-BLOCKING SPECULATIVE PREPARATION ===' | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_nonblocking_speculative_preparation_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_005_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_nonblocking_speculative_preparation_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_rev005_install_identity_hotfix.py 2>&1 | tee -a "$LOG"

      - name: Verify inherited contracts on rev005 tree
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

      - name: Rev005 idempotent re-entry
        shell: bash
        run: |
          set -euo pipefail
          LOG=aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/apply_aeris25_nonblocking_speculative_preparation_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/fix_aeris25_phase6_005_inherited_selftests.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_nonblocking_speculative_preparation_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_rev005_install_identity_hotfix.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/verify_aeris25_persistent_presentation_batching.py 2>&1 | tee -a "$LOG"
          PYTHONDONTWRITEBYTECODE=1 python3 Tools/run_v01800_operation_health_pass3_prebuild.py 2>&1 | tee -a "$LOG"

      - name: Generated C# non-blocking structure sanity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs').read_text()
          depth=0; state='code'; i=0; minimum=0
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1<len(s) else ''
              if state=='code':
                  if c=='/' and n=='/': state='line'; i+=2; continue
                  if c=='/' and n=='*': state='block'; i+=2; continue
                  if c=='"': state='str'; i+=1; continue
                  if c=="'": state='char'; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}': depth-=1; minimum=min(minimum,depth)
                  i+=1; continue
              if state=='line':
                  if c=='\n': state='code'
                  i+=1; continue
              if state=='block':
                  if c=='*' and n=='/': state='code'; i+=2; continue
                  i+=1; continue
              if state in ('str','char'):
                  if c=='\\': i+=2; continue
                  if (state=='str' and c=='"') or (state=='char' and c=="'"): state='code'
                  i+=1
          assert depth==0 and minimum==0,(depth,minimum)
          assert 'AERIS25_PHASE6_005_NONBLOCKING_SPECULATIVE_PREPARATION' in s
          assert 'ManagedPreparationMaximumInFlight = 4' in s
          assert 'DetachManagedPreparationWaiter(pending);' in s
          assert 'oh_managed_prep_hol_bypass=' in s
          assert 'if (!ReferenceEquals(pendingEntryCommit, pending)) return;' not in s
          print('[PHASE6_005 CSHARP STRUCTURE] PASS')
          PY
          git diff --check

      - name: Assert final rev005 markers
        run: |
          grep -Fq '[AERIS25 NOREPINEPHRINE PHASE6_005 NON-BLOCKING SPECULATIVE PREPARATION] STATIC PASS' aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          grep -Fq '[AERIS25 NOREPINEPHRINE REV005 INSTALL IDENTITY HOTFIX] STATIC PASS' aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          grep -Fq 'non-blocking speculative preparation already present' aeris25_phase6_005_nonblocking_speculative_preparation_static.log
          grep -Fq '[Operation Health Pass 3 PREBUILD] 20/20 suites PASS' aeris25_phase6_005_nonblocking_speculative_preparation_static.log

      - name: Upload rev005 static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris25-phase6-005-nonblocking-speculative-preparation-static
          path: |
            aeris25_phase6_005_nonblocking_speculative_preparation_static.log
            Source/AERISFlightControl/Terrain/AERISTerrainGpuTileRenderer.cs
            Source/AERISFlightControl/Performance/AERISOperationHealthPenicillin.cs
            GameData/AERISFlightControl/Config/AERISOperationHealth.cfg
            Tools/verify_aeris25_persistent_presentation_batching.py
            Tools/prepare_aeris25_main_thread_commit_governor_rev005_runtime.py
            Tools/verify_aeris25_rev005_install_identity_hotfix.py
            build_ubuntu.sh
          if-no-files-found: error
